# =============================================================================
# Mathematics curriculum knowledge base
#
# Concepts from elementary school through roughly the first two years of
# undergraduate mathematics, with prerequisite ("depends on") edges.
#
# Edge direction: foundation -> concept that builds on it.
# "a -> b -> c" means a is a prerequisite of b, and b of c.
#
# Schema: see docs/SCHEMA.md
# =============================================================================

categories:
  # ---------------------------------------------------------------------------
  # Numbers & Counting
  # ---------------------------------------------------------------------------
  - id: numbers
    label: "Numbers & Counting"
    wikipedia: Number
    description: "The most basic ideas of quantity: counting things, naming numbers, and writing them down."
    concepts:
      - id: counting
        label: "Counting"
        wikipedia: Counting
        stage: elementary
        description: "Saying number names in order while pointing at objects to find how many there are."
      - id: natural-numbers
        label: "Natural Numbers"
        wikipedia: Natural_number
        stage: elementary
        description: "The counting numbers 1, 2, 3, ... (and usually 0), the first numbers anyone meets."
      - id: place-value
        label: "Place Value"
        wikipedia: Positional_notation
        stage: elementary
        description: "Writing numbers with digits whose value depends on their position, as in 305 = 3 hundreds + 5 ones."
      - id: number-line
        label: "The Number Line"
        wikipedia: Number_line
        stage: elementary
        description: "A straight line with numbers placed at equal intervals, giving a picture of order and distance."

  # ---------------------------------------------------------------------------
  # Arithmetic
  # ---------------------------------------------------------------------------
  - id: arithmetic
    label: "Arithmetic"
    wikipedia: Arithmetic
    description: "Calculating with numbers: the four basic operations and their extensions."
    concepts:
      - id: addition
        label: "Addition"
        wikipedia: Addition
        stage: elementary
        description: "Combining two quantities into a total."
      - id: subtraction
        label: "Subtraction"
        wikipedia: Subtraction
        stage: elementary
        description: "Taking one quantity away from another, or finding the difference between them."
      - id: multiplication
        label: "Multiplication"
        wikipedia: Multiplication
        stage: elementary
        description: "Repeated addition of equal groups, and later the scaling of one quantity by another."
      - id: division
        label: "Division"
        wikipedia: Division_(mathematics)
        stage: elementary
        description: "Splitting a quantity into equal parts, or finding how many times one number fits into another."
      - id: fractions
        label: "Fractions"
        wikipedia: Fraction
        stage: elementary
        description: "Numbers like 3/4 that describe parts of a whole as a ratio of two integers."
      - id: decimals
        label: "Decimals"
        wikipedia: Decimal
        stage: elementary
        description: "Extending place value to the right of the decimal point to write fractional quantities."
      - id: percentages
        label: "Percentages"
        wikipedia: Percentage
        stage: middle
        description: "Expressing a proportion as a number of parts per hundred."
      - id: ratios
        label: "Ratios & Proportions"
        wikipedia: Ratio
        stage: middle
        description: "Comparing two quantities by division, and reasoning about quantities that scale together."
      - id: order-of-operations
        label: "Order of Operations"
        wikipedia: Order_of_operations
        stage: elementary
        description: "The conventions (parentheses, exponents, multiplication before addition) that make an expression unambiguous."
      - id: exponentiation
        label: "Exponents"
        wikipedia: Exponentiation
        stage: middle
        description: "Repeated multiplication, written as a base raised to a power."
      - id: square-roots
        label: "Square Roots"
        wikipedia: Square_root
        stage: middle
        description: "The inverse of squaring: the square root of 9 is 3 because 3 x 3 = 9."

  # ---------------------------------------------------------------------------
  # Number Systems
  # ---------------------------------------------------------------------------
  - id: number-systems
    label: "Number Systems"
    wikipedia: Number_system
    description: "Successive enlargements of the idea of number: integers, rationals, reals, complex numbers and beyond."
    concepts:
      - id: integers
        label: "Integers"
        wikipedia: Integer
        stage: middle
        description: "Whole numbers extended with negatives: ..., -2, -1, 0, 1, 2, ..., closing subtraction."
      - id: rational-numbers
        label: "Rational Numbers"
        wikipedia: Rational_number
        stage: middle
        description: "Numbers expressible as a fraction of two integers, closing division."
      - id: irrational-numbers
        label: "Irrational Numbers"
        wikipedia: Irrational_number
        stage: middle
        description: "Numbers such as the square root of 2 and pi that cannot be written as a fraction of integers."
      - id: real-numbers
        label: "Real Numbers"
        wikipedia: Real_number
        stage: high-school
        description: "All the numbers on the number line, rational and irrational together, with no gaps."
      - id: complex-numbers
        label: "Complex Numbers"
        wikipedia: Complex_number
        stage: high-school
        description: "Numbers of the form a + bi, where i squares to -1; every polynomial equation has roots among them."
      - id: quaternions
        label: "Quaternions"
        wikipedia: Quaternion
        stage: undergraduate
        description: "A four-dimensional extension of the complex numbers where multiplication no longer commutes; useful for describing 3D rotations."
      - id: prime-numbers
        label: "Prime Numbers"
        wikipedia: Prime_number
        stage: elementary
        description: "Numbers greater than 1 divisible only by 1 and themselves; the multiplicative building blocks of the integers."

  # ---------------------------------------------------------------------------
  # Algebra
  # ---------------------------------------------------------------------------
  - id: algebra
    label: "Algebra"
    wikipedia: Algebra
    description: "Working with symbols that stand for numbers: expressions, equations, and how to solve them."
    concepts:
      - id: variables
        label: "Variables"
        wikipedia: Variable_(mathematics)
        stage: middle
        description: "Letters that stand for unknown or arbitrary numbers, the key step from arithmetic to algebra."
      - id: algebraic-expressions
        label: "Algebraic Expressions"
        wikipedia: Expression_(mathematics)
        stage: middle
        description: "Combinations of numbers, variables, and operations, such as 3x + 2, that can be evaluated and rearranged."
      - id: linear-equations
        label: "Linear Equations"
        wikipedia: Linear_equation
        stage: middle
        description: "Equations like 2x + 3 = 11 whose unknowns appear only to the first power, solved by undoing operations."
      - id: inequalities
        label: "Inequalities"
        wikipedia: Inequality_(mathematics)
        stage: middle
        description: "Statements that one expression is less than or greater than another, with solution sets rather than single answers."
      - id: systems-of-equations
        label: "Systems of Linear Equations"
        wikipedia: System_of_linear_equations
        stage: high-school
        description: "Several linear equations solved simultaneously, by substitution or elimination."
      - id: polynomials
        label: "Polynomials"
        wikipedia: Polynomial
        stage: high-school
        description: "Sums of terms with whole-number powers of a variable, such as x^3 - 2x + 1."
      - id: factoring
        label: "Factoring"
        wikipedia: Factorization
        stage: high-school
        description: "Rewriting a number or polynomial as a product of simpler pieces, mirroring prime factorization."
      - id: quadratic-equations
        label: "Quadratic Equations"
        wikipedia: Quadratic_equation
        stage: high-school
        description: "Second-degree equations solved by factoring, completing the square, or the quadratic formula."
      - id: logarithms
        label: "Logarithms"
        wikipedia: Logarithm
        stage: high-school
        description: "The inverse of exponentiation: the logarithm of a number is the exponent needed to produce it."

  # ---------------------------------------------------------------------------
  # Geometry
  # ---------------------------------------------------------------------------
  - id: geometry
    label: "Geometry"
    wikipedia: Geometry
    description: "The mathematics of shape, size, and position, from measuring figures to coordinates and proof."
    concepts:
      - id: angles
        label: "Angles"
        wikipedia: Angle
        stage: elementary
        description: "The amount of turn between two rays meeting at a point, measured in degrees."
      - id: triangles
        label: "Triangles"
        wikipedia: Triangle
        stage: elementary
        description: "Three-sided polygons, classified by their sides and angles; the simplest rigid shape."
      - id: circles
        label: "Circles"
        wikipedia: Circle
        stage: elementary
        description: "All points at a fixed distance from a center; the source of pi, arcs, and angles of rotation."
      - id: area
        label: "Area"
        wikipedia: Area
        stage: elementary
        description: "The amount of surface a two-dimensional shape covers, measured in square units."
      - id: volume
        label: "Volume"
        wikipedia: Volume
        stage: middle
        description: "The amount of space a three-dimensional object occupies, measured in cubic units."
      - id: congruence
        label: "Congruence"
        wikipedia: Congruence_(geometry)
        stage: middle
        description: "Two figures are congruent when one can be moved onto the other without stretching; same shape and same size."
      - id: similarity
        label: "Similarity"
        wikipedia: Similarity_(geometry)
        stage: middle
        description: "Figures with the same shape but possibly different size; corresponding sides are in proportion."
      - id: pythagorean-theorem
        label: "Pythagorean Theorem"
        wikipedia: Pythagorean_theorem
        stage: middle
        description: "In a right triangle the square on the hypotenuse equals the sum of the squares on the legs."
      - id: coordinate-geometry
        label: "Coordinate Geometry"
        wikipedia: Analytic_geometry
        stage: high-school
        description: "Describing points, lines, and curves with coordinates, so geometric questions become algebraic ones."

  # ---------------------------------------------------------------------------
  # Trigonometry
  # ---------------------------------------------------------------------------
  - id: trigonometry
    label: "Trigonometry"
    wikipedia: Trigonometry
    description: "The study of angles and the periodic functions that arise from triangles and circles."
    concepts:
      - id: trig-functions
        label: "Trigonometric Functions"
        wikipedia: Trigonometric_functions
        stage: high-school
        description: "Sine, cosine, and tangent: ratios of sides in a right triangle that depend only on an angle."
      - id: radians
        label: "Radians"
        wikipedia: Radian
        stage: high-school
        description: "Measuring angles by arc length along a unit circle; the natural unit for calculus."
      - id: unit-circle
        label: "The Unit Circle"
        wikipedia: Unit_circle
        stage: high-school
        description: "The circle of radius 1 centered at the origin, extending sine and cosine to all angles."
      - id: trig-identities
        label: "Trigonometric Identities"
        wikipedia: List_of_trigonometric_identities
        stage: high-school
        description: "Equations like sin^2 + cos^2 = 1 relating trigonometric functions, used to simplify expressions."
      - id: inverse-trig-functions
        label: "Inverse Trigonometric Functions"
        wikipedia: Inverse_trigonometric_functions
        stage: high-school
        description: "Arcsine, arccosine, and arctangent: recovering an angle from the value of a trigonometric ratio."
      - id: polar-coordinates
        label: "Polar Coordinates"
        wikipedia: Polar_coordinate_system
        stage: high-school
        description: "Locating points by distance from the origin and angle from an axis, instead of x and y."

  # ---------------------------------------------------------------------------
  # Functions & Graphs
  # ---------------------------------------------------------------------------
  - id: functions-and-graphs
    label: "Functions & Graphs"
    wikipedia: Function_(mathematics)
    description: "The idea of a function as a rule assigning outputs to inputs, and the pictures functions make."
    concepts:
      - id: functions
        label: "Functions"
        wikipedia: Function_(mathematics)
        stage: middle
        description: "A rule assigning exactly one output to each input; the central object of modern mathematics."
      - id: graphing
        label: "Graphs of Functions"
        wikipedia: Graph_of_a_function
        stage: middle
        description: "Plotting input-output pairs in the coordinate plane to see a function's behavior at a glance."
      - id: slope
        label: "Slope"
        wikipedia: Slope
        stage: middle
        description: "The steepness of a line: rise over run, the rate at which one quantity changes with another."
      - id: function-composition
        label: "Function Composition"
        wikipedia: Function_composition
        stage: high-school
        description: "Applying one function to the result of another, chaining rules together."
      - id: inverse-functions
        label: "Inverse Functions"
        wikipedia: Inverse_function
        stage: high-school
        description: "A function that undoes another, swapping the roles of inputs and outputs."
      - id: exponential-functions
        label: "Exponential Functions"
        wikipedia: Exponential_function
        stage: high-school
        description: "Functions like 2^x whose value multiplies by a fixed factor at each step; the mathematics of growth and decay."
      - id: sequences
        label: "Sequences"
        wikipedia: Sequence
        stage: high-school
        description: "Ordered lists of numbers generated by a rule, such as arithmetic and geometric progressions."

  # ---------------------------------------------------------------------------
  # Calculus
  # ---------------------------------------------------------------------------
  - id: calculus
    label: "Calculus"
    wikipedia: Calculus
    description: "The mathematics of change and accumulation, built on the idea of a limit."
    concepts:
      - id: limits
        label: "Limits"
        wikipedia: Limit_(mathematics)
        stage: high-school
        description: "The value a function or sequence approaches; the rigorous foundation beneath all of calculus."
      - id: continuity
        label: "Continuity"
        wikipedia: Continuous_function
        stage: high-school
        description: "A function is continuous when small changes in input produce small changes in output; its graph has no jumps."
      - id: derivatives
        label: "Derivatives"
        wikipedia: Derivative
        stage: high-school
        description: "The instantaneous rate of change of a function, defined as the limit of slopes of secant lines."
      - id: chain-rule
        label: "Chain Rule"
        wikipedia: Chain_rule
        stage: high-school
        description: "How to differentiate a composition of functions: multiply the rates of change of the pieces."
      - id: integrals
        label: "Integrals"
        wikipedia: Integral
        stage: high-school
        description: "Accumulated totals such as area under a curve, defined as limits of finer and finer sums."
      - id: fundamental-theorem-of-calculus
        label: "Fundamental Theorem of Calculus"
        wikipedia: Fundamental_theorem_of_calculus
        stage: high-school
        description: "Differentiation and integration are inverse operations, so areas can be computed from antiderivatives."
      - id: integration-techniques
        label: "Integration Techniques"
        wikipedia: Integration_by_parts
        stage: undergraduate
        description: "Substitution, integration by parts, partial fractions, and trigonometric methods for finding antiderivatives."
      - id: infinite-series
        label: "Infinite Series"
        wikipedia: Series_(mathematics)
        stage: undergraduate
        description: "Sums of infinitely many terms, which may converge to a finite value; convergence tests decide which do."
      - id: taylor-series
        label: "Taylor Series"
        wikipedia: Taylor_series
        stage: undergraduate
        description: "Representing a function as an infinite polynomial built from its derivatives at a point."
      - id: partial-derivatives
        label: "Partial Derivatives"
        wikipedia: Partial_derivative
        stage: undergraduate
        description: "Rates of change of functions of several variables, taken one variable at a time."
      - id: differential-equations
        label: "Differential Equations"
        wikipedia: Differential_equation
        stage: undergraduate
        description: "Equations relating a function to its derivatives; the language of physical laws and dynamic systems."
      - id: real-analysis
        label: "Real Analysis"
        wikipedia: Real_analysis
        stage: undergraduate
        description: "The rigorous theory behind calculus: precise definitions and proofs for limits, continuity, and convergence."

  # ---------------------------------------------------------------------------
  # Linear Algebra
  # ---------------------------------------------------------------------------
  - id: linear-algebra
    label: "Linear Algebra"
    wikipedia: Linear_algebra
    description: "Vectors, matrices, and linear transformations: the mathematics of flat, proportional structure in any dimension."
    concepts:
      - id: vectors
        label: "Vectors"
        wikipedia: Euclidean_vector
        stage: high-school
        description: "Quantities with both magnitude and direction, added tip-to-tail and scaled by numbers."
      - id: dot-product
        label: "Dot Product"
        wikipedia: Dot_product
        stage: high-school
        description: "A product of two vectors yielding a number that measures how much they point the same way."
      - id: matrices
        label: "Matrices"
        wikipedia: Matrix_(mathematics)
        stage: high-school
        description: "Rectangular arrays of numbers that encode systems of equations and linear transformations."
      - id: determinants
        label: "Determinants"
        wikipedia: Determinant
        stage: undergraduate
        description: "A single number computed from a square matrix that measures volume scaling and detects invertibility."
      - id: linear-independence
        label: "Linear Independence"
        wikipedia: Linear_independence
        stage: undergraduate
        description: "A set of vectors is independent when none can be built from the others; the key to bases and dimension."
      - id: vector-spaces
        label: "Vector Spaces"
        wikipedia: Vector_space
        stage: undergraduate
        description: "Abstract settings where vectors can be added and scaled, unifying geometry, polynomials, and functions."
      - id: linear-transformations
        label: "Linear Transformations"
        wikipedia: Linear_map
        stage: undergraduate
        description: "Maps between vector spaces that preserve addition and scaling; every matrix represents one."
      - id: eigenvalues
        label: "Eigenvalues & Eigenvectors"
        wikipedia: Eigenvalues_and_eigenvectors
        stage: undergraduate
        description: "Special directions a transformation only stretches, and the stretch factors; central to dynamics and data analysis."

  # ---------------------------------------------------------------------------
  # Probability & Statistics
  # ---------------------------------------------------------------------------
  - id: probability-statistics
    label: "Probability & Statistics"
    wikipedia: Probability_and_statistics
    description: "Reasoning about uncertainty and learning from data."
    concepts:
      - id: probability
        label: "Probability"
        wikipedia: Probability
        stage: middle
        description: "Assigning numbers between 0 and 1 to how likely events are, and computing with them."
      - id: conditional-probability
        label: "Conditional Probability"
        wikipedia: Conditional_probability
        stage: high-school
        description: "The probability of one event given that another has occurred."
      - id: bayes-theorem
        label: "Bayes' Theorem"
        wikipedia: Bayes'_theorem
        stage: undergraduate
        description: "How to update probabilities in light of new evidence, by reversing conditional probabilities."
      - id: descriptive-statistics
        label: "Descriptive Statistics"
        wikipedia: Descriptive_statistics
        stage: middle
        description: "Summarizing data with measures like mean, median, and spread, and with charts."
      - id: random-variables
        label: "Random Variables"
        wikipedia: Random_variable
        stage: high-school
        description: "Numerical outcomes of random processes, letting probability be studied with functions and algebra."
      - id: probability-distributions
        label: "Probability Distributions"
        wikipedia: Probability_distribution
        stage: high-school
        description: "The complete description of how likely each value of a random variable is."
      - id: expected-value
        label: "Expected Value"
        wikipedia: Expected_value
        stage: high-school
        description: "The long-run average of a random quantity, weighting each outcome by its probability."
      - id: normal-distribution
        label: "The Normal Distribution"
        wikipedia: Normal_distribution
        stage: high-school
        description: "The bell curve that appears throughout nature and statistics, characterized by its mean and standard deviation."
      - id: central-limit-theorem
        label: "Central Limit Theorem"
        wikipedia: Central_limit_theorem
        stage: undergraduate
        description: "Averages of many independent random quantities are approximately normally distributed, whatever the original distribution."
      - id: hypothesis-testing
        label: "Hypothesis Testing"
        wikipedia: Statistical_hypothesis_testing
        stage: undergraduate
        description: "Deciding whether data provide convincing evidence against a default assumption, using p-values and significance."
      - id: regression
        label: "Regression"
        wikipedia: Regression_analysis
        stage: undergraduate
        description: "Fitting lines and curves to data to model and predict the relationship between variables."

  # ---------------------------------------------------------------------------
  # Discrete Mathematics
  # ---------------------------------------------------------------------------
  - id: discrete-math
    label: "Discrete Mathematics"
    wikipedia: Discrete_mathematics
    description: "Mathematics of distinct, separate objects: logic, sets, counting, and networks - the foundation of computer science."
    concepts:
      - id: sets
        label: "Sets"
        wikipedia: Set_(mathematics)
        stage: high-school
        description: "Collections of distinct objects, with operations like union and intersection; the standard foundation for mathematics."
      - id: logic
        label: "Propositional Logic"
        wikipedia: Propositional_calculus
        stage: high-school
        description: "The rules of valid reasoning with statements, connectives, and truth tables."
      - id: proofs
        label: "Mathematical Proof"
        wikipedia: Mathematical_proof
        stage: high-school
        description: "Rigorous arguments that establish mathematical truths beyond doubt, including direct proof and contradiction."
      - id: induction
        label: "Mathematical Induction"
        wikipedia: Mathematical_induction
        stage: high-school
        description: "Proving a statement for all natural numbers by establishing a base case and a step from each number to the next."
      - id: combinatorics
        label: "Combinatorics"
        wikipedia: Combinatorics
        stage: high-school
        description: "Systematic counting: permutations, combinations, and the art of enumerating arrangements."
      - id: graph-theory
        label: "Graph Theory"
        wikipedia: Graph_theory
        stage: undergraduate
        description: "Networks of vertices connected by edges, modeling everything from road maps to dependencies like this one."
      - id: modular-arithmetic
        label: "Modular Arithmetic"
        wikipedia: Modular_arithmetic
        stage: undergraduate
        description: "Arithmetic with remainders, where numbers wrap around a modulus like hours on a clock; the basis of cryptography."

  # ---------------------------------------------------------------------------
  # Abstract Algebra
  # ---------------------------------------------------------------------------
  - id: abstract-algebra
    label: "Abstract Algebra"
    wikipedia: Abstract_algebra
    description: "Studying algebraic structure itself: axioms for systems where addition-like and multiplication-like operations live."
    concepts:
      - id: groups
        label: "Groups"
        wikipedia: Group_(mathematics)
        stage: undergraduate
        description: "Sets with a single associative, invertible operation; the abstract theory of symmetry."
      - id: rings
        label: "Rings"
        wikipedia: Ring_(mathematics)
        stage: undergraduate
        description: "Structures with both addition and multiplication, modeled on the integers."
      - id: fields
        label: "Fields"
        wikipedia: Field_(mathematics)
        stage: undergraduate
        description: "Rings in which every nonzero element has a multiplicative inverse, such as the rationals, reals, and complex numbers."

edges:
