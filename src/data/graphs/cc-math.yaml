  - id: g-mg-1
    label: "G-MG.1 — Use geometric shapes, their measures, and their properties to describe objects"
    group: g-mg-a
    maturityLevel: high-school
    description: "Common Core G-MG.1: Use geometric shapes, their measures, and their properties to describe objects (e.g., modeling a tree trunk or a human torso as a cylinder).★"
  - id: g-mg-2
    label: "G-MG.2 — Apply concepts of density based on area and volume in modeling situations"
    group: g-mg-a
    maturityLevel: high-school
    description: "Common Core G-MG.2: Apply concepts of density based on area and volume in modeling situations (e.g., persons per square mile, BTUs per cubic foot).★"
  - id: g-mg-3
    label: "G-MG.3 — Apply geometric methods to solve design problems"
    group: g-mg-a
    maturityLevel: high-school
    description: "Common Core G-MG.3: Apply geometric methods to solve design problems (e.g., designing an object or structure to satisfy physical constraints or minimize cost; working with typographic grid systems based on ratios).★"
  - id: s-id-1
    label: "S-ID.1 — Represent data with plots on the real number line (dot plots, histograms, and box plots)"
    group: s-id-a
    maturityLevel: high-school
    description: "Common Core S-ID.1: Represent data with plots on the real number line (dot plots, histograms, and box plots)."
  - id: s-id-2
    label: "S-ID.2 — Use statistics appropriate to the shape of the data distribution to compare center"
    group: s-id-a
    maturityLevel: high-school
    description: "Common Core S-ID.2: Use statistics appropriate to the shape of the data distribution to compare center (median, mean) and spread (interquartile range, standard deviation) of two or more different data sets."
  - id: s-id-3
    label: "S-ID.3 — Interpret differences in shape, center, and spread in the context of the data sets,…"
    group: s-id-a
    maturityLevel: high-school
    description: "Common Core S-ID.3: Interpret differences in shape, center, and spread in the context of the data sets, accounting for possible effects of extreme data points (outliers)."
  - id: s-id-4
    label: "S-ID.4 — Use the mean and standard deviation of a data set to fit it to a normal distribution and…"
    group: s-id-a
    maturityLevel: high-school
    description: "Common Core S-ID.4: Use the mean and standard deviation of a data set to fit it to a normal distribution and to estimate population percentages. Recognize that there are data sets for which such a procedure is not appropriate. Use calculators, spreadsheets, and tables to estimate areas under the normal curve."
  - id: s-id-5
    label: "S-ID.5 — Summarize categorical data for two categories in two-way frequency tables"
    group: s-id-b
    maturityLevel: high-school
    description: "Common Core S-ID.5: Summarize categorical data for two categories in two-way frequency tables. Interpret relative frequencies in the context of the data (including joint, marginal, and conditional relative frequencies). Recognize possible associations and trends in the data."
  - id: s-id-6
    label: "S-ID.6 — Represent data on two quantitative variables on a scatter plot"
    group: s-id-b
    maturityLevel: high-school
    description: "Common Core S-ID.6: Represent data on two quantitative variables on a scatter plot, and describe how the variables are related. Substandards: a. Fit a function to the data; use functions fitted to data to solve problems in the context of the data. b. Informally assess the fit of a function by plotting and analyzing residuals. c. Fit a linear function for a scatter plot that suggests a linear association."
  - id: s-id-7
    label: "S-ID.7 — Interpret the slope (rate of change) and the intercept (constant term) of a linear model…"
    group: s-id-c
    maturityLevel: high-school
    description: "Common Core S-ID.7: Interpret the slope (rate of change) and the intercept (constant term) of a linear model in the context of the data."
  - id: s-id-8
    label: "S-ID.8 — Compute (using technology) and interpret the correlation coefficient of a linear fit"
    group: s-id-c
    maturityLevel: high-school
    description: "Common Core S-ID.8: Compute (using technology) and interpret the correlation coefficient of a linear fit."
  - id: s-id-9
    label: "S-ID.9 — Distinguish between correlation and causation"
    group: s-id-c
    maturityLevel: high-school
    description: "Common Core S-ID.9: Distinguish between correlation and causation."
  - id: s-ic-1
    label: "S-IC.1 — Understand statistics as a process for making inferences about population parameters…"
    group: s-ic-a
    maturityLevel: high-school
    description: "Common Core S-IC.1: Understand statistics as a process for making inferences about population parameters based on a random sample from that population."
  - id: s-ic-2
    label: "S-IC.2 — Decide if a specified model is consistent with results from a given data-generating process"
    group: s-ic-a
    maturityLevel: high-school
    description: "Common Core S-IC.2: Decide if a specified model is consistent with results from a given data-generating process, e.g., using simulation. Clarifications: For example, a model says a spinning coin falls heads up with probability 0.5. Would a result of 5 tails in a row cause you to question the model?"
  - id: s-ic-3
    label: "S-IC.3 — Recognize the purposes of and differences among sample surveys"
    group: s-ic-b
    maturityLevel: high-school
    description: "Common Core S-IC.3: Recognize the purposes of and differences among sample surveys, experiments, and observational studies; explain how randomization relates to each."
  - id: s-ic-4
    label: "S-IC.4 — Use data from a sample survey to estimate a population mean or proportion"
    group: s-ic-b
    maturityLevel: high-school
    description: "Common Core S-IC.4: Use data from a sample survey to estimate a population mean or proportion; develop a margin of error through the use of simulation models for random sampling."
  - id: s-ic-5
    label: "S-IC.5 — Use data from a randomized experiment to compare two treatments"
    group: s-ic-b
    maturityLevel: high-school
    description: "Common Core S-IC.5: Use data from a randomized experiment to compare two treatments; use simulations to decide if differences between parameters are significant."
  - id: s-ic-6
    label: "S-IC.6 — Evaluate reports based on data"
    group: s-ic-b
    maturityLevel: high-school
    description: "Common Core S-IC.6: Evaluate reports based on data."
  - id: s-cp-1
    label: "S-CP.1 — Describe events as subsets of a sample space (the set of outcomes) using characteristics…"
    group: s-cp-a
    maturityLevel: high-school
    description: "Common Core S-CP.1: Describe events as subsets of a sample space (the set of outcomes) using characteristics (or categories) of the outcomes, or as unions, intersections, or complements of other events (\"or,\" \"and,\" \"not\")."
  - id: s-cp-2
    label: "S-CP.2 — Understand that two events A and B are independent if the probability of A and B…"
    group: s-cp-a
    maturityLevel: high-school
    description: "Common Core S-CP.2: Understand that two events A and B are independent if the probability of A and B occurring together is the product of their probabilities, and use this characterization to determine if they are independent."
  - id: s-cp-3
    label: "S-CP.3 — Understand the conditional probability of A given B as P(A and B)/P(B)"
    group: s-cp-a
    maturityLevel: high-school
    description: "Common Core S-CP.3: Understand the conditional probability of A given B as P(A and B)/P(B), and interpret independence of A and B as saying that the conditional probability of A given B is the same as the probability of A, and the conditional probability of B given A is the same as the probability of B."
  - id: s-cp-4
    label: "S-CP.4 — Construct and interpret two-way frequency tables of data when two categories are…"
    group: s-cp-a
    maturityLevel: high-school
    description: "Common Core S-CP.4: Construct and interpret two-way frequency tables of data when two categories are associated with each object being classified. Use the two-way table as a sample space to decide if events are independent and to approximate conditional probabilities. Clarifications: For example, collect data from a random sample of students in your school on their favorite subject among math, science, and English. Estimate the probability that a randomly selected student from your school will favor science given that the student is in tenth grade. Do the same for other subjects and compare the results."
  - id: s-cp-5
    label: "S-CP.5 — Recognize and explain the concepts of conditional probability and independence in…"
    group: s-cp-a
    maturityLevel: high-school
    description: "Common Core S-CP.5: Recognize and explain the concepts of conditional probability and independence in everyday language and everyday situations. Clarifications: For example, compare the chance of having lung cancer if you are a smoker with the chance of being a smoker if you have lung cancer."
  - id: s-cp-6
    label: "S-CP.6 — Find the conditional probability of A given B as the fraction of B's outcomes that also…"
    group: s-cp-b
    maturityLevel: high-school
    description: "Common Core S-CP.6: Find the conditional probability of A given B as the fraction of B's outcomes that also belong to A, and interpret the answer in terms of the model."
  - id: s-cp-7
    label: "S-CP.7 — Apply the Addition Rule, P(A or B) = P(A) + P(B) — P(A and B), and interpret the answer…"
    group: s-cp-b
    maturityLevel: high-school
    description: "Common Core S-CP.7: Apply the Addition Rule, P(A or B) = P(A) + P(B) — P(A and B), and interpret the answer in terms of the model."
  - id: s-cp-8
    label: "S-CP.8 (+) — Apply the general Multiplication Rule in a uniform probability model"
    group: s-cp-b
    maturityLevel: high-school
    description: "Common Core S-CP.8: (+) Apply the general Multiplication Rule in a uniform probability model, P(A and B) = P(A)P(B|A) = P(B)P(A|B), and interpret the answer in terms of the model."
  - id: s-cp-9
    label: "S-CP.9 (+) — Use permutations and combinations to compute probabilities of compound events and solve…"
    group: s-cp-b
    maturityLevel: high-school
    description: "Common Core S-CP.9: (+) Use permutations and combinations to compute probabilities of compound events and solve problems."
  - id: s-md-1
    label: "S-MD.1 (+) — Define a random variable for a quantity of interest by assigning a numerical value to…"
    group: s-md-a
    maturityLevel: high-school
    description: "Common Core S-MD.1: (+) Define a random variable for a quantity of interest by assigning a numerical value to each event in a sample space; graph the corresponding probability distribution using the same graphical displays as for data distributions."
  - id: s-md-2
    label: "S-MD.2 (+) — Calculate the expected value of a random variable"
    group: s-md-a
    maturityLevel: high-school
    description: "Common Core S-MD.2: (+) Calculate the expected value of a random variable; interpret it as the mean of the probability distribution."
  - id: s-md-3
    label: "S-MD.3 (+) — Develop a probability distribution for a random variable defined for a sample space in…"
    group: s-md-a
    maturityLevel: high-school
    description: "Common Core S-MD.3: (+) Develop a probability distribution for a random variable defined for a sample space in which theoretical probabilities can be calculated; find the expected value. Clarifications: For example, find the theoretical probability distribution for the number of correct answers obtained by guessing on all five questions of a multiple-choice test where each question has four choices, and find the expected grade under various grading schemes."
  - id: s-md-4
    label: "S-MD.4 (+) — Develop a probability distribution for a random variable defined for a sample space in…"
    group: s-md-a
    maturityLevel: high-school
    description: "Common Core S-MD.4: (+) Develop a probability distribution for a random variable defined for a sample space in which probabilities are assigned empirically; find the expected value. Clarifications: For example, find a current data distribution on the number of TV sets per household in the United States, and calculate the expected number of sets per household. How many TV sets would you expect to find in 100 randomly selected households?"
  - id: s-md-5
    label: "S-MD.5 (+) — Weigh the possible outcomes of a decision by assigning probabilities to payoff values…"
    group: s-md-b
    maturityLevel: high-school
    description: "Common Core S-MD.5: (+) Weigh the possible outcomes of a decision by assigning probabilities to payoff values and finding expected values. Substandards: a. Find the expected payoff for a game of chance. b. Evaluate and compare strategies on the basis of expected values."
  - id: s-md-6
    label: "S-MD.6 (+) — Use probabilities to make fair decisions"
    group: s-md-b
    maturityLevel: high-school
    description: "Common Core S-MD.6: (+) Use probabilities to make fair decisions (e.g., drawing by lots, using a random number generator)."
  - id: s-md-7
    label: "S-MD.7 (+) — Analyze decisions and strategies using probability concepts"
    group: s-md-b
    maturityLevel: high-school
    description: "Common Core S-MD.7: (+) Analyze decisions and strategies using probability concepts (e.g., product testing, medical testing, pulling a hockey goalie at the end of a game)."
  - id: hs-modeling-cycle
    label: "High School Mathematical Modeling Cycle"
    group: hs-modeling
    maturityLevel: high-school
    description: "The Common Core high school modeling cycle identifies variables, formulates a model, analyzes relationships, interprets results, validates conclusions, and reports conclusions. Source: Math_Standards1.pdf, pp. 72–73; modeling standards are marked ★ throughout the high school categories rather than assigned a standalone standard code."

