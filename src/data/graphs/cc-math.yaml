concepts:
  - id: k-cc-1
    label: "K.CC.1 — Count to 100 by ones and by tens"
    group: k-cc-a
    maturityLevel: kindergarten
    description: "Common Core K.CC.1: Count to 100 by ones and by tens."
  - id: k-cc-2
    label: "K.CC.2 — Count forward beginning from a given number within the known sequence"
    group: k-cc-a
    maturityLevel: kindergarten
    description: "Common Core K.CC.2: Count forward beginning from a given number within the known sequence (instead of having to begin at 1)."
  - id: k-cc-3
    label: "K.CC.3 — Write numbers from 0 to 20"
    group: k-cc-a
    maturityLevel: kindergarten
    description: "Common Core K.CC.3: Write numbers from 0 to 20. Represent a number of objects with a written numeral 0-20 (with 0 representing a count of no objects)."
  - id: k-cc-4
    label: "K.CC.4 — Understand the relationship between numbers and quantities; connect counting to cardinality"
    group: k-cc-b
    maturityLevel: kindergarten
    description: "Common Core K.CC.4: Understand the relationship between numbers and quantities; connect counting to cardinality. Substandards: a. When counting objects, say the number names in the standard order, pairing each object with one and only one number name and each number name with one and only one object. b. Understand that the last number name said tells the number of objects counted. The number of objects is the same regardless of their arrangement or the order in which they were counted. c. Understand that each successive number name refers to a quantity that is one larger."
  - id: k-cc-5
    label: "K.CC.5 — Count to answer \"how many?\" questions about as many as 20 things arranged in a line"
    group: k-cc-b
    maturityLevel: kindergarten
    description: "Common Core K.CC.5: Count to answer \"how many?\" questions about as many as 20 things arranged in a line, a rectangular array, or a circle, or as many as 10 things in a scattered configuration; given a number from 1—20, count out that many objects."
  - id: k-cc-6
    label: "K.CC.6 — Identify whether the number of objects in one group is greater than"
    group: k-cc-c
    maturityLevel: kindergarten
    description: "Common Core K.CC.6: Identify whether the number of objects in one group is greater than, less than, or equal to the number of objects in another group, e.g., by using matching and counting strategies. Clarifications: Include groups with up to ten objects."
  - id: k-cc-7
    label: "K.CC.7 — Compare two numbers between 1 and 10 presented as written numerals"
    group: k-cc-c
    maturityLevel: kindergarten
    description: "Common Core K.CC.7: Compare two numbers between 1 and 10 presented as written numerals."
  - id: k-oa-1
    label: "K.OA.1 — Represent addition and subtraction with objects, fingers, mental images, drawings, sounds"
    group: k-oa-a
    maturityLevel: kindergarten
    description: "Common Core K.OA.1: Represent addition and subtraction with objects, fingers, mental images, drawings, sounds (e.g., claps), acting out situations, verbal explanations, expressions, or equations. Clarifications: Drawings need not show details, but should show the mathematics in the problem (This applies wherever drawings are mentioned in the Standards.)"
  - id: k-oa-2
    label: "K.OA.2 — Solve addition and subtraction word problems, and add and subtract within 10"
    group: k-oa-a
    maturityLevel: kindergarten
    description: "Common Core K.OA.2: Solve addition and subtraction word problems, and add and subtract within 10, e.g., by using objects or drawings to represent the problem."
  - id: k-oa-3
    label: "K.OA.3 — Decompose numbers less than or equal to 10 into pairs in more than one way"
    group: k-oa-a
    maturityLevel: kindergarten
    description: "Common Core K.OA.3: Decompose numbers less than or equal to 10 into pairs in more than one way, e.g., by using objects or drawings, and record each decomposition by a drawing or equation (e.g., 5 = 2 + 3 and 5 = 4 + 1)."
  - id: k-oa-4
    label: "K.OA.4 — For any number from 1 to 9, find the number that makes 10 when added to the given number"
    group: k-oa-a
    maturityLevel: kindergarten
    description: "Common Core K.OA.4: For any number from 1 to 9, find the number that makes 10 when added to the given number, e.g., by using objects or drawings, and record the answer with a drawing or equation."
  - id: k-oa-5
    label: "K.OA.5 — Fluently add and subtract within 5"
    group: k-oa-a
    maturityLevel: kindergarten
    description: "Common Core K.OA.5: Fluently add and subtract within 5."
  - id: 1-oa-1
    label: "1.OA.1 — Use addition and subtraction within 20 to solve word problems involving situations of…"
    group: 1-oa-a
    maturityLevel: grade-1
    description: "Common Core 1.OA.1: Use addition and subtraction within 20 to solve word problems involving situations of adding to, taking from, putting together, taking apart, and comparing, with unknowns in all positions, e.g., by using objects, drawings, and equations with a symbol for the unknown number to represent the problem."
  - id: 1-oa-2
    label: "1.OA.2 — Solve word problems that call for addition of three whole numbers whose sum is less than…"
    group: 1-oa-a
    maturityLevel: grade-1
    description: "Common Core 1.OA.2: Solve word problems that call for addition of three whole numbers whose sum is less than or equal to 20, e.g., by using objects, drawings, and equations with a symbol for the unknown number to represent the problem."
  - id: 2-oa-1
    label: "2.OA.1 — Use addition and subtraction within 100 to solve one- and two-step word problems…"
    group: 2-oa-a
    maturityLevel: grade-2
    description: "Common Core 2.OA.1: Use addition and subtraction within 100 to solve one- and two-step word problems involving situations of adding to, taking from, putting together, taking apart, and comparing, with unknowns in all positions, e.g., by using drawings and equations with a symbol for the unknown number to represent the problem."
  - id: 1-oa-3
    label: "1.OA.3 — Apply properties of operations as strategies to add and subtract"
    group: 1-oa-b
    maturityLevel: grade-1
    description: "Common Core 1.OA.3: Apply properties of operations as strategies to add and subtract. Clarifications: Students need not use formal terms for these properties. To add 2 + 6 + 4, the second two numbers can be added to make a ten, so 2 + 6 + 4 = 2 + 10 = 12. (Associative property of addition.) If 8 + 3 = 11 is known, then 3 + 8 = 11 is also known. (Commutative property of addition.)"
  - id: 1-oa-4
    label: "1.OA.4 — Understand subtraction as an unknown-addend problem"
    group: 1-oa-b
    maturityLevel: grade-1
    description: "Common Core 1.OA.4: Understand subtraction as an unknown-addend problem. Clarifications: For example, subtract 10 - 8 by finding the number that makes 10 when added to 8."
  - id: 1-oa-5
    label: "1.OA.5 — Relate counting to addition and subtraction"
    group: 1-oa-c
    maturityLevel: grade-1
    description: "Common Core 1.OA.5: Relate counting to addition and subtraction (e.g., by counting on 2 to add 2)."
  - id: 1-oa-6
    label: "1.OA.6 — Add and subtract within 20, demonstrating fluency for addition and subtraction within 10"
    group: 1-oa-c
    maturityLevel: grade-1
    description: "Common Core 1.OA.6: Add and subtract within 20, demonstrating fluency for addition and subtraction within 10. Use strategies such as counting on; making ten (e.g., 8 + 6 = 8 + 2 + 4 = 10 + 4 = 14); decomposing a number leading to a ten (e.g., 13 — 4 = 13 — 3 — 1 = 10 — 1 = 9); using the relationship between addition and subtraction (e.g., knowing that 8 + 4 = 12, one knows 12 — 8 = 4); and creating equivalent but easier or known sums (e.g., adding 6 + 7 by creating the known equivalent 6 + 6 + 1 = 12 + 1 = 13)."
  - id: 2-oa-2
    label: "2.OA.2 — Fluently add and subtract within 20 using mental strategies"
    group: 2-oa-b
    maturityLevel: grade-2
    description: "Common Core 2.OA.2: Fluently add and subtract within 20 using mental strategies. By end of Grade 2, know from memory all sums of two one-digit numbers. Clarifications: See standard 1.OA.6 for a list of mental strategies."
  - id: 1-oa-7
    label: "1.OA.7 — Understand the meaning of the equal sign"
    group: 1-oa-d
    maturityLevel: grade-1
    description: "Common Core 1.OA.7: Understand the meaning of the equal sign, and determine if equations involving addition and subtraction are true or false. Clarifications: For example, which of the following equations are true and which are false? 6 = 6, 7 = 8 - 1, 5 + 2 = 2 + 5, 4 + 1 = 5 + 2."
  - id: 1-oa-8
    label: "1.OA.8 — Determine the unknown whole number in an addition or subtraction equation relating three…"
    group: 1-oa-d
    maturityLevel: grade-1
    description: "Common Core 1.OA.8: Determine the unknown whole number in an addition or subtraction equation relating three whole numbers. Clarifications: For example, determine the unknown number that makes the equation true in each of the equations 8 + ? = 11, 5 = - 3, 6 + 6 = ."
  - id: 2-oa-3
    label: "2.OA.3 — Determine whether a group of objects (up to 20) has an odd or even number of members"
    group: 2-oa-c
    maturityLevel: grade-2
    description: "Common Core 2.OA.3: Determine whether a group of objects (up to 20) has an odd or even number of members, e.g., by pairing objects or counting them by 2s; write an equation to express an even number as a sum of two equal addends."
  - id: 2-oa-4
    label: "2.OA.4 — Use addition to find the total number of objects arranged in rectangular arrays with up…"
    group: 2-oa-c
    maturityLevel: grade-2
    description: "Common Core 2.OA.4: Use addition to find the total number of objects arranged in rectangular arrays with up to 5 rows and up to 5 columns; write an equation to express the total as a sum of equal addends."
  - id: 3-oa-1
    label: "3.OA.1 — Interpret products of whole numbers"
    group: 3-oa-a
    maturityLevel: grade-3
    description: "Common Core 3.OA.1: Interpret products of whole numbers, e.g., interpret 5 × 7 as the total number of objects in 5 groups of 7 objects each. Clarifications: For example, describe a context in which a total number of objects can be expressed as 5 × 7."
  - id: 3-oa-2
    label: "3.OA.2 — Interpret whole-number quotients of whole numbers"
    group: 3-oa-a
    maturityLevel: grade-3
    description: "Common Core 3.OA.2: Interpret whole-number quotients of whole numbers, e.g., interpret 56 ÷ 8 as the number of objects in each share when 56 objects are partitioned equally into 8 shares, or as a number of shares when 56 objects are partitioned into equal shares of 8 objects each. Clarifications: For example, describe a context in which a number of shares or a number of groups can be expressed as 56 ÷ 8."
  - id: 3-oa-3
    label: "3.OA.3 — Use multiplication and division within 100 to solve word problems in situations…"
    group: 3-oa-a
    maturityLevel: grade-3
    description: "Common Core 3.OA.3: Use multiplication and division within 100 to solve word problems in situations involving equal groups, arrays, and measurement quantities, e.g., by using drawings and equations with a symbol for the unknown number to represent the problem."
  - id: 3-oa-4
    label: "3.OA.4 — Determine the unknown whole number in a multiplication or division equation relating…"
    group: 3-oa-a
    maturityLevel: grade-3
    description: "Common Core 3.OA.4: Determine the unknown whole number in a multiplication or division equation relating three whole numbers. Clarifications: For example, determine the unknown number that makes the equation true in each of the equations 8 × ? = 48, 5 = ÷ 3, 6 × 6 = ?."
  - id: 3-oa-5
    label: "3.OA.5 — Apply properties of operations as strategies to multiply and divide"
    group: 3-oa-b
    maturityLevel: grade-3
    description: "Common Core 3.OA.5: Apply properties of operations as strategies to multiply and divide. Clarifications: Students need not use formal terms for these properties. Example: Knowing that 8 × 5 = 40 and 8 × 2 = 16, one can find 8 × 7 as 8 × (5 + 2) = (8 × 5) + (8 × 2) = 40 + 16 = 56. (Distributive property.) Example: If 6 × 4 = 24 is known, then 4 × 6 = 24 is also known (Commutative property of multiplication.) 3 × 5 × 2 can be found by 3 × 5 = 15, then 15 × 2 = 30, or by 5 × 2 = 10, then 3 × 10 = 30. (Associative property of multiplication.)"
  - id: 3-oa-6
    label: "3.OA.6 — Understand division as an unknown-factor problem"
    group: 3-oa-b
    maturityLevel: grade-3
    description: "Common Core 3.OA.6: Understand division as an unknown-factor problem. Clarifications: For example, find 32 ÷ 8 by finding the number that makes 32 when multiplied by 8."
  - id: 3-oa-7
    label: "3.OA.7 — Fluently multiply and divide within 100"
    group: 3-oa-c
    maturityLevel: grade-3
    description: "Common Core 3.OA.7: Fluently multiply and divide within 100, using strategies such as the relationship between multiplication and division (e.g., knowing that 8 × 5 = 40, one knows 40 ÷ 5 = 8) or properties of operations. By the end of Grade 3, know from memory all products of two one-digit numbers."
  - id: 3-oa-8
    label: "3.OA.8 — Solve two-step word problems using the four operations"
    group: 3-oa-d
    maturityLevel: grade-3
    description: "Common Core 3.OA.8: Solve two-step word problems using the four operations. Represent these problems using equations with a letter standing for the unknown quantity. Assess the reasonableness of answers using mental computation and estimation strategies including rounding. Clarifications: This standard is limited to problems posed with whole numbers and having whole-number answers; students should know how to perform operations in the conventional order when there are no parentheses to specify a particular order (Order of Operations)."
  - id: 3-oa-9
    label: "3.OA.9 — Identify arithmetic patterns"
    group: 3-oa-d
    maturityLevel: grade-3
    description: "Common Core 3.OA.9: Identify arithmetic patterns (including patterns in the addition table or multiplication table), and explain them using properties of operations. Clarifications: For example, observe that 4 times a number is always even, and explain why 4 times a number can be decomposed into two equal addends."
  - id: 4-oa-1
    label: "4.OA.1 — Interpret a multiplication equation as a comparison"
    group: 4-oa-a
    maturityLevel: grade-4
    description: "Common Core 4.OA.1: Interpret a multiplication equation as a comparison, e.g., interpret 35 = 5 × 7 as a statement that 35 is 5 times as many as 7 and 7 times as many as 5. Represent verbal statements of multiplicative comparisons as multiplication equations."
  - id: 4-oa-2
    label: "4.OA.2 — Multiply or divide to solve word problems involving multiplicative comparison"
    group: 4-oa-a
    maturityLevel: grade-4
    description: "Common Core 4.OA.2: Multiply or divide to solve word problems involving multiplicative comparison, e.g., by using drawings and equations with a symbol for the unknown number to represent the problem, distinguishing multiplicative comparison from additive comparison."
  - id: 4-oa-3
    label: "4.OA.3 — Solve multistep word problems posed with whole numbers and having whole-number answers…"
    group: 4-oa-a
    maturityLevel: grade-4
    description: "Common Core 4.OA.3: Solve multistep word problems posed with whole numbers and having whole-number answers using the four operations, including problems in which remainders must be interpreted. Represent these problems using equations with a letter standing for the unknown quantity. Assess the reasonableness of answers using mental computation and estimation strategies including rounding."
  - id: 4-oa-4
    label: "4.OA.4 — Find all factor pairs for a whole number in the range 1—100"
    group: 4-oa-b
    maturityLevel: grade-4
    description: "Common Core 4.OA.4: Find all factor pairs for a whole number in the range 1—100. Recognize that a whole number is a multiple of each of its factors. Determine whether a given whole number in the range 1—100 is a multiple of a given one-digit number. Determine whether a given whole number in the range 1—100 is prime or composite."
  - id: 4-oa-5
    label: "4.OA.5 — Generate a number or shape pattern that follows a given rule"
    group: 4-oa-c
    maturityLevel: grade-4
    description: "Common Core 4.OA.5: Generate a number or shape pattern that follows a given rule. Identify apparent features of the pattern that were not explicit in the rule itself. Clarifications: For example, given the rule \"Add 3\" and the starting number 1, generate terms in the resulting sequence and observe that the terms appear to alternate between odd and even numbers. Explain informally why the numbers will continue to alternate in this way."
  - id: 5-oa-1
    label: "5.OA.1 — Use parentheses, brackets, or braces in numerical expressions, and evaluate expressions…"
    group: 5-oa-a
    maturityLevel: grade-5
    description: "Common Core 5.OA.1: Use parentheses, brackets, or braces in numerical expressions, and evaluate expressions with these symbols."
  - id: 5-oa-2
    label: "5.OA.2 — Write simple expressions that record calculations with numbers"
    group: 5-oa-a
    maturityLevel: grade-5
    description: "Common Core 5.OA.2: Write simple expressions that record calculations with numbers, and interpret numerical expressions without evaluating them. Clarifications: For example, express the calculation \"add 8 and 7, then multiply by 2\" as 2 × (8 + 7). Recognize that 3 × (18932 + 921) is three times as large as 18932 + 921, without having to calculate the indicated sum or product."
  - id: 5-oa-3
    label: "5.OA.3 — Generate two numerical patterns using two given rules"
    group: 5-oa-b
    maturityLevel: grade-5
    description: "Common Core 5.OA.3: Generate two numerical patterns using two given rules. Identify apparent relationships between corresponding terms. Form ordered pairs consisting of corresponding terms from the two patterns, and graph the ordered pairs on a coordinate plane. Clarifications: For example, given the rule \"Add 3\" and the starting number 0, and given the rule \"Add 6\" and the starting number 0, generate terms in the resulting sequences, and observe that the terms in one sequence are twice the corresponding terms in the other sequence. Explain informally why this is so."
  - id: k-nbt-1
    label: "K.NBT.1 — Compose and decompose numbers from 11 to 19 into ten ones and some further ones"
    group: k-nbt-a
    maturityLevel: kindergarten
    description: "Common Core K.NBT.1: Compose and decompose numbers from 11 to 19 into ten ones and some further ones, e.g., by using objects or drawings, and record each composition or decomposition by a drawing or equation (e.g., 18 = 10 + 8); understand that these numbers are composed of ten ones and one, two, three, four, five, six, seven, eight, or nine ones."
  - id: 1-nbt-1
    label: "1.NBT.1 — Count to 120, starting at any number less than 120"
    group: 1-nbt-a
    maturityLevel: grade-1
    description: "Common Core 1.NBT.1: Count to 120, starting at any number less than 120. In this range, read and write numerals and represent a number of objects with a written numeral."
  - id: 1-nbt-2
    label: "1.NBT.2 — Understand that the two digits of a two-digit number represent amounts of tens and ones"
    group: 1-nbt-b
    maturityLevel: grade-1
    description: "Common Core 1.NBT.2: Understand that the two digits of a two-digit number represent amounts of tens and ones. Understand the following as special cases: Substandards: undefined. 10 can be thought of as a bundle of ten ones — called a \"ten.\" undefined. The numbers from 11 to 19 are composed of a ten and one, two, three, four, five, six, seven, eight, or nine ones. undefined. The numbers 10, 20, 30, 40, 50, 60, 70, 80, 90 refer to one, two, three, four, five, six, seven, eight, or nine tens (and 0 ones)."
  - id: 1-nbt-3
    label: "1.NBT.3 — Compare two two-digit numbers based on meanings of the tens and ones digits"
    group: 1-nbt-b
    maturityLevel: grade-1
    description: "Common Core 1.NBT.3: Compare two two-digit numbers based on meanings of the tens and ones digits, recording the results of comparisons with the symbols >, =, and <."
  - id: 2-nbt-1
    label: "2.NBT.1 — Understand that the three digits of a three-digit number represent amounts of hundreds"
    group: 2-nbt-a
    maturityLevel: grade-2
    description: "Common Core 2.NBT.1: Understand that the three digits of a three-digit number represent amounts of hundreds, tens, and ones; e.g., 706 equals 7 hundreds, 0 tens, and 6 ones. Understand the following as special cases: Substandards: undefined. 100 can be thought of as a bundle of ten tens — called a \"hundred.\" undefined. The numbers 100, 200, 300, 400, 500, 600, 700, 800, 900 refer to one, two, three, four, five, six, seven, eight, or nine hundreds (and 0 tens and 0 ones)."
  - id: 2-nbt-2
    label: "2.NBT.2 — Count within 1000; skip-count by 5s, 10s, and 100s"
    group: 2-nbt-a
    maturityLevel: grade-2
    description: "Common Core 2.NBT.2: Count within 1000; skip-count by 5s, 10s, and 100s."
  - id: 2-nbt-3
    label: "2.NBT.3 — Read and write numbers to 1000 using base-ten numerals, number names, and expanded form"
    group: 2-nbt-a
    maturityLevel: grade-2
    description: "Common Core 2.NBT.3: Read and write numbers to 1000 using base-ten numerals, number names, and expanded form."
  - id: 2-nbt-4
    label: "2.NBT.4 — Compare two three-digit numbers based on meanings of the hundreds"
    group: 2-nbt-a
    maturityLevel: grade-2
    description: "Common Core 2.NBT.4: Compare two three-digit numbers based on meanings of the hundreds, tens, and ones digits, using >, =, and < symbols to record the results of comparisons."
  - id: 1-nbt-4
    label: "1.NBT.4 — Add within 100, including adding a two-digit number and a one-digit number, and adding a…"
    group: 1-nbt-c
    maturityLevel: grade-1
    description: "Common Core 1.NBT.4: Add within 100, including adding a two-digit number and a one-digit number, and adding a two-digit number and a multiple of 10, using concrete models or drawings and strategies based on place value, properties of operations, and/or the relationship between addition and subtraction; relate the strategy to a written method and explain the reasoning used. Understand that in adding two-digit numbers, one adds tens and tens, ones and ones; and sometimes it is necessary to compose a ten."
  - id: 1-nbt-5
    label: "1.NBT.5 — Given a two-digit number, mentally find 10 more or 10 less than the number, without…"
    group: 1-nbt-c
    maturityLevel: grade-1
    description: "Common Core 1.NBT.5: Given a two-digit number, mentally find 10 more or 10 less than the number, without having to count; explain the reasoning used."
  - id: 1-nbt-6
    label: "1.NBT.6 — Subtract multiples of 10 in the range 10-90 from multiples of 10 in the range 10-90…"
    group: 1-nbt-c
    maturityLevel: grade-1
    description: "Common Core 1.NBT.6: Subtract multiples of 10 in the range 10-90 from multiples of 10 in the range 10-90 (positive or zero differences), using concrete models or drawings and strategies based on place value, properties of operations, and/or the relationship between addition and subtraction; relate the strategy to a written method and explain the reasoning used."
  - id: 2-nbt-5
    label: "2.NBT.5 — Fluently add and subtract within 100 using strategies based on place value"
    group: 2-nbt-b
    maturityLevel: grade-2
    description: "Common Core 2.NBT.5: Fluently add and subtract within 100 using strategies based on place value, properties of operations, and/or the relationship between addition and subtraction."
  - id: 2-nbt-6
    label: "2.NBT.6 — Add up to four two-digit numbers using strategies based on placevalue and properties of…"
    group: 2-nbt-b
    maturityLevel: grade-2
    description: "Common Core 2.NBT.6: Add up to four two-digit numbers using strategies based on placevalue and properties of operations."
  - id: 2-nbt-7
    label: "2.NBT.7 — Add and subtract within 1000, using concrete models or drawings and strategies based on…"
    group: 2-nbt-b
    maturityLevel: grade-2
    description: "Common Core 2.NBT.7: Add and subtract within 1000, using concrete models or drawings and strategies based on place value, properties of operations, and/or the relationship between addition and subtraction; relate the strategy to a written method. Understand that in adding or subtracting three-digit numbers, one adds or subtracts hundreds and hundreds, tens and tens, ones and ones; and sometimes it is necessary to compose or decompose tens or hundreds."
  - id: 2-nbt-8
    label: "2.NBT.8 — Mentally add 10 or 100 to a given number 100—900"
    group: 2-nbt-b
    maturityLevel: grade-2
    description: "Common Core 2.NBT.8: Mentally add 10 or 100 to a given number 100—900, and mentally subtract 10 or 100 from a given number 100—900."
  - id: 2-nbt-9
    label: "2.NBT.9 — Explain why addition and subtraction strategies work"
    group: 2-nbt-b
    maturityLevel: grade-2
    description: "Common Core 2.NBT.9: Explain why addition and subtraction strategies work, using place value and the properties of operations. Clarifications: Explanations may be supported by drawings or objects."
  - id: 3-nbt-1
    label: "3.NBT.1 — Use place value understanding to round whole numbers to the nearest 10 or 100"
    group: 3-nbt-a
    maturityLevel: grade-3
    description: "Common Core 3.NBT.1: Use place value understanding to round whole numbers to the nearest 10 or 100."
  - id: 3-nbt-2
    label: "3.NBT.2 — Fluently add and subtract within 1000 using strategies and algorithms based on place value"
    group: 3-nbt-a
    maturityLevel: grade-3
    description: "Common Core 3.NBT.2: Fluently add and subtract within 1000 using strategies and algorithms based on place value, properties of operations, and/or the relationship between addition and subtraction."
  - id: 3-nbt-3
    label: "3.NBT.3 — Multiply one-digit whole numbers by multiples of 10 in the range 10—90"
    group: 3-nbt-a
    maturityLevel: grade-3
    description: "Common Core 3.NBT.3: Multiply one-digit whole numbers by multiples of 10 in the range 10—90 (e.g., 9 × 80, 5 × 60) using strategies based on place value and properties of operations."
  - id: 4-nbt-4
    label: "4.NBT.4 — Fluently add and subtract multi-digit whole numbers using the standard algorithm"
    group: 4-nbt-b
    maturityLevel: grade-4
    description: "Common Core 4.NBT.4: Fluently add and subtract multi-digit whole numbers using the standard algorithm."
  - id: 4-nbt-5
    label: "4.NBT.5 — Multiply a whole number of up to four digits by a one-digit whole number"
    group: 4-nbt-b
    maturityLevel: grade-4
    description: "Common Core 4.NBT.5: Multiply a whole number of up to four digits by a one-digit whole number, and multiply two two-digit numbers, using strategies based on place value and the properties of operations. Illustrate and explain the calculation by using equations, rectangular arrays, and/or area models."
  - id: 4-nbt-6
    label: "4.NBT.6 — Find whole-number quotients and remainders with up to four-digit dividends and one-digit…"
    group: 4-nbt-b
    maturityLevel: grade-4
    description: "Common Core 4.NBT.6: Find whole-number quotients and remainders with up to four-digit dividends and one-digit divisors, using strategies based on place value, the properties of operations, and/or the relationship between multiplication and division. Illustrate and explain the calculation by using equations, rectangular arrays, and/or area models."
  - id: 4-nbt-1
    label: "4.NBT.1 — Recognize that in a multi-digit whole number"
    group: 4-nbt-a
    maturityLevel: grade-4
    description: "Common Core 4.NBT.1: Recognize that in a multi-digit whole number, a digit in one place represents ten times what it represents in the place to its right. Clarifications: For example, recognize that 700 ÷ 70 = 10 by applying concepts of place value and division."
  - id: 4-nbt-2
    label: "4.NBT.2 — Read and write multi-digit whole numbers using base-ten numerals"
    group: 4-nbt-a
    maturityLevel: grade-4
    description: "Common Core 4.NBT.2: Read and write multi-digit whole numbers using base-ten numerals, number names, and expanded form. Compare two multi-digit numbers based on meanings of the digits in each place, using >, =, and < symbols to record the results of comparisons."
  - id: 4-nbt-3
    label: "4.NBT.3 — Use place value understanding to round multi-digit whole numbers to any place"
    group: 4-nbt-a
    maturityLevel: grade-4
    description: "Common Core 4.NBT.3: Use place value understanding to round multi-digit whole numbers to any place."
  - id: 5-nbt-1
    label: "5.NBT.1 — Recognize that in a multi-digit number"
    group: 5-nbt-a
    maturityLevel: grade-5
    description: "Common Core 5.NBT.1: Recognize that in a multi-digit number, a digit in one place represents 10 times as much as it represents in the place to its right and 1/10 of what it represents in the place to its left."
  - id: 5-nbt-2
    label: "5.NBT.2 — Explain patterns in the number of zeros of the product when multiplying a number by…"
    group: 5-nbt-a
    maturityLevel: grade-5
    description: "Common Core 5.NBT.2: Explain patterns in the number of zeros of the product when multiplying a number by powers of 10, and explain patterns in the placement of the decimal point when a decimal is multiplied or divided by a power of 10. Use whole-number exponents to denote powers of 10."
  - id: 5-nbt-3
    label: "5.NBT.3 — Read, write, and compare decimals to thousandths"
    group: 5-nbt-a
    maturityLevel: grade-5
    description: "Common Core 5.NBT.3: Read, write, and compare decimals to thousandths. Substandards: a. Read and write decimals to thousandths using base-ten numerals, number names, and expanded form, e.g., 347.392 = 3 × 100 + 4 × 10 + 7 × 1 + 3 × (1/10) + 9 × (1/100) + 2 × (1/1000). b. Compare two decimals to thousandths based on meanings of the digits in each place, using >, =, and < symbols to record the results of comparisons."
  - id: 5-nbt-4
    label: "5.NBT.4 — Use place value understanding to round decimals to any place"
    group: 5-nbt-a
    maturityLevel: grade-5
    description: "Common Core 5.NBT.4: Use place value understanding to round decimals to any place."
  - id: 5-nbt-5
    label: "5.NBT.5 — Fluently multiply multi-digit whole numbers using the standardalgorithm"
    group: 5-nbt-b
    maturityLevel: grade-5
    description: "Common Core 5.NBT.5: Fluently multiply multi-digit whole numbers using the standardalgorithm."
  - id: 5-nbt-6
    label: "5.NBT.6 — Find whole-number quotients of whole numbers with up to four-digit dividends and…"
    group: 5-nbt-b
    maturityLevel: grade-5
    description: "Common Core 5.NBT.6: Find whole-number quotients of whole numbers with up to four-digit dividends and two-digit divisors, using strategies based on place value, the properties of operations, and/or the relationship between multiplication and division. Illustrate and explain the calculation by using equations, rectangular arrays, and/or area models."
  - id: 5-nbt-7
    label: "5.NBT.7 — Add, subtract, multiply, and divide decimals to hundredths, using concrete models or…"
    group: 5-nbt-b
    maturityLevel: grade-5
    description: "Common Core 5.NBT.7: Add, subtract, multiply, and divide decimals to hundredths, using concrete models or drawings and strategies based on place value, properties of operations, and/or the relationship between addition and subtraction; relate the strategy to a written method and explain the reasoning used."
  - id: k-md-1
    label: "K.MD.1 — Describe measurable attributes of objects, such as length or weight"
    group: k-md-a
    maturityLevel: kindergarten
    description: "Common Core K.MD.1: Describe measurable attributes of objects, such as length or weight. Describe several measurable attributes of a single object."
  - id: k-md-2
    label: "K.MD.2 — Directly compare two objects with a measurable attribute in common"
    group: k-md-a
    maturityLevel: kindergarten
    description: "Common Core K.MD.2: Directly compare two objects with a measurable attribute in common, to see which object has \"more of\"/\"less of\" the attribute, and describe the difference. Clarifications: For example, directly compare the heights of two children and describe one child as taller/shorter."
  - id: k-md-3
    label: "K.MD.3 — Classify objects into given categories"
    group: k-md-b
    maturityLevel: kindergarten
    description: "Common Core K.MD.3: Classify objects into given categories; count the numbers of objects in each category and sort the categories by count. Clarifications: Limit category counts to be less than or equal to 10."
  - id: 1-md-1
    label: "1.MD.1 — Order three objects by length; compare the lengths of two objects indirectly by using a…"
    group: 1-md-a
    maturityLevel: grade-1
    description: "Common Core 1.MD.1: Order three objects by length; compare the lengths of two objects indirectly by using a third object."
  - id: 1-md-2
    label: "1.MD.2 — Express the length of an object as a whole number of length units"
    group: 1-md-a
    maturityLevel: grade-1
    description: "Common Core 1.MD.2: Express the length of an object as a whole number of length units, by laying multiple copies of a shorter object (the length unit) end to end; understand that the length measurement of an object is the number of same-size length units that span it with no gaps or overlaps. Clarifications: Limit to contexts where the object being measured is spanned by a whole number of length units with no gaps or overlaps."
  - id: 1-md-3
    label: "1.MD.3 — Tell and write time in hours and half-hours using analog and digital clocks"
    group: 1-md-b
    maturityLevel: grade-1
    description: "Common Core 1.MD.3: Tell and write time in hours and half-hours using analog and digital clocks."
  - id: 1-md-4
    label: "1.MD.4 — Organize, represent, and interpret data with up to three categories"
    group: 1-md-c
    maturityLevel: grade-1
    description: "Common Core 1.MD.4: Organize, represent, and interpret data with up to three categories; ask and answer questions about the total number of data points, how many in each category, and how many more or less are in one category than in another."
  - id: 2-md-9
    label: "2.MD.9 — Generate measurement data by measuring lengths of several objects to the nearest whole unit"
    group: 2-md-a
    maturityLevel: grade-2
    description: "Common Core 2.MD.9: Generate measurement data by measuring lengths of several objects to the nearest whole unit, or by making repeated measurements of the same object. Show the measurements by making a line plot, where the horizontal scale is marked off in whole-number units."
  - id: 2-md-10
    label: "2.MD.10 — Draw a picture graph and a bar graph (with single-unit scale) to represent a data set…"
    group: 2-md-a
    maturityLevel: grade-2
    description: "Common Core 2.MD.10: Draw a picture graph and a bar graph (with single-unit scale) to represent a data set with up to four categories. Solve simple put-together, take-apart, and compare problems using information presented in a bar graph."
  - id: 3-md-3
    label: "3.MD.3 — Draw a scaled picture graph and a scaled bar graph to represent a data set with several…"
    group: 3-md-b
    maturityLevel: grade-3
    description: "Common Core 3.MD.3: Draw a scaled picture graph and a scaled bar graph to represent a data set with several categories. Solve one- and two-step \"how many more\" and \"how many less\" problems using information presented in scaled bar graphs. Clarifications: For example, draw a bar graph in which each square in the bar graph might represent 5 pets."
  - id: 3-md-4
    label: "3.MD.4 — Generate measurement data by measuring lengths using rulers marked with halves and…"
    group: 3-md-b
    maturityLevel: grade-3
    description: "Common Core 3.MD.4: Generate measurement data by measuring lengths using rulers marked with halves and fourths of an inch. Show the data by making a line plot, where the horizontal scale is marked off in appropriate units— whole numbers, halves, or quarters."
  - id: 4-md-4
    label: "4.MD.4 — Make a line plot to display a data set of measurements in fractions of a unit"
    group: 4-md-b
    maturityLevel: grade-4
    description: "Common Core 4.MD.4: Make a line plot to display a data set of measurements in fractions of a unit (1/2, 1/4, 1/8). Solve problems involving addition and subtraction of fractions by using information presented in line plots. Clarifications: For example, from a line plot find and interpret the difference in length between the longest and shortest specimens in an insect collection."
  - id: 5-md-2
    label: "5.MD.2 — Make a line plot to display a data set of measurements in fractions of a unit"
    group: 5-md-b
    maturityLevel: grade-5
    description: "Common Core 5.MD.2: Make a line plot to display a data set of measurements in fractions of a unit (1/2, 1/4, 1/8). Use operations on fractions for this grade to solve problems involving information presented in line plots. Clarifications: For example, given different measurements of liquid in identical beakers, find the amount of liquid each beaker would contain if the total amount in all the beakers were redistributed equally."
  - id: 2-md-1
    label: "2.MD.1 — Measure the length of an object by selecting and using appropriate tools such as rulers"
    group: 2-md-b
    maturityLevel: grade-2
    description: "Common Core 2.MD.1: Measure the length of an object by selecting and using appropriate tools such as rulers, yardsticks, meter sticks, and measuring tapes."
  - id: 2-md-2
    label: "2.MD.2 — Measure the length of an object twice"
    group: 2-md-b
    maturityLevel: grade-2
    description: "Common Core 2.MD.2: Measure the length of an object twice, using length units of different lengths for the two measurements; describe how the two measurements relate to the size of the unit chosen."
  - id: 2-md-3
    label: "2.MD.3 — Estimate lengths using units of inches, feet, centimeters, and meters"
    group: 2-md-b
    maturityLevel: grade-2
    description: "Common Core 2.MD.3: Estimate lengths using units of inches, feet, centimeters, and meters."
  - id: 2-md-4
    label: "2.MD.4 — Measure to determine how much longer one object is than another"
    group: 2-md-b
    maturityLevel: grade-2
    description: "Common Core 2.MD.4: Measure to determine how much longer one object is than another, expressing the length difference in terms of a standard length unit."
  - id: 2-md-5
    label: "2.MD.5 — Use addition and subtraction within 100 to solve word problems involving lengths that…"
    group: 2-md-c
    maturityLevel: grade-2
    description: "Common Core 2.MD.5: Use addition and subtraction within 100 to solve word problems involving lengths that are given in the same units, e.g., by using drawings (such as drawings of rulers) and equations with a symbol for the unknown number to represent the problem."
  - id: 2-md-6
    label: "2.MD.6 — Represent whole numbers as lengths from 0 on a number line diagram with equally spaced…"
    group: 2-md-c
    maturityLevel: grade-2
    description: "Common Core 2.MD.6: Represent whole numbers as lengths from 0 on a number line diagram with equally spaced points corresponding to the numbers 0, 1, 2, ..., and represent whole-number sums and differences within 100 on a number line diagram."
  - id: 2-md-7
    label: "2.MD.7 — Tell and write time from analog and digital clocks to the nearest five minutes, using a.m"
    group: 2-md-d
    maturityLevel: grade-2
    description: "Common Core 2.MD.7: Tell and write time from analog and digital clocks to the nearest five minutes, using a.m. and p.m."
  - id: 2-md-8
    label: "2.MD.8 — Solve word problems involving dollar bills"
    group: 2-md-d
    maturityLevel: grade-2
    description: "Common Core 2.MD.8: Solve word problems involving dollar bills, quarters, dimes, nickels, and pennies, using $ and ¢ symbols appropriately. Clarifications: Example: If you have 2 dimes and 3 pennies, how many cents do you have?"
  - id: 3-md-1
    label: "3.MD.1 — Tell and write time to the nearest minute and measure time intervals in minutes"
    group: 3-md-a
    maturityLevel: grade-3
    description: "Common Core 3.MD.1: Tell and write time to the nearest minute and measure time intervals in minutes. Solve word problems involving addition and subtraction of time intervals in minutes, e.g., by representing the problem on a number line diagram."
  - id: 3-md-2
    label: "3.MD.2 — Measure and estimate liquid volumes and masses of objects using standard units of grams (g)"
    group: 3-md-a
    maturityLevel: grade-3
    description: "Common Core 3.MD.2: Measure and estimate liquid volumes and masses of objects using standard units of grams (g), kilograms (kg), and liters (l). Add, subtract, multiply, or divide to solve one-step word problems involving masses or volumes that are given in the same units, e.g., by using drawings (such as a beaker with a measurement scale) to represent the problem. Clarifications: Excludes multiplicative comparison problems (problems involving notions of \"times as much\"; Excludes compound units such as cm³ and finding the geometric volume of a container."
  - id: 3-md-5
    label: "3.MD.5 — Recognize area as an attribute of plane figures and understand concepts of area measurement"
    group: 3-md-c
    maturityLevel: grade-3
    description: "Common Core 3.MD.5: Recognize area as an attribute of plane figures and understand concepts of area measurement. Substandards: a. A square with side length 1 unit, called \"a unit square,\" is said to have \"one square unit\" of area, and can be used to measure area. b. A plane figure which can be covered without gaps or overlaps by n unit squares is said to have an area of n square units."
  - id: 3-md-6
    label: "3.MD.6 — Measure areas by counting unit squares"
    group: 3-md-c
    maturityLevel: grade-3
    description: "Common Core 3.MD.6: Measure areas by counting unit squares (square cm, square m, square in, square ft, and improvised units)."
  - id: 3-md-7
    label: "3.MD.7 — Relate area to the operations of multiplication and addition"
    group: 3-md-c
    maturityLevel: grade-3
    description: "Common Core 3.MD.7: Relate area to the operations of multiplication and addition. Substandards: a. Find the area of a rectangle with whole-number side lengths by tiling it, and show that the area is the same as would be found by multiplying the side lengths. b. Multiply side lengths to find areas of rectangles with whole-number side lengths in the context of solving real world and mathematical problems, and represent whole-number products as rectangular areas in mathematical reasoning. c. Use tiling to show in a concrete case that the area of a rectangle with whole-number side lengths a and b + c is the sum of a × b and a × c. Use area models to represent the distributive property in mathematical reasoning. d. Recognize area as additive. Find areas of rectilinear figures by decomposing them into non-overlapping rectangles and adding the areas of the non-overlapping parts, applying this technique to solve real world problems."
  - id: 3-md-8
    label: "3.MD.8 — Solve real world and mathematical problems involving perimeters of polygons"
    group: 3-md-d
    maturityLevel: grade-3
    description: "Common Core 3.MD.8: Solve real world and mathematical problems involving perimeters of polygons, including finding the perimeter given the side lengths, finding an unknown side length, and exhibiting rectangles with the same perimeter and different areas or with the same area and different perimeters."
  - id: 4-md-1
    label: "4.MD.1 — Know relative sizes of measurement units within one system of units including km, m, cm"
    group: 4-md-a
    maturityLevel: grade-4
    description: "Common Core 4.MD.1: Know relative sizes of measurement units within one system of units including km, m, cm; kg, g; lb, oz.; l, ml; hr, min, sec. Within a single system of measurement, express measurements in a larger unit in terms of a smaller unit. Record measurement equivalents in a two column table. Clarifications: For example, know that 1 ft is 12 times as long as 1 in. Express the length of a 4 ft snake as 48 in. Generate a conversion table for feet and inches listing the number pairs (1, 12), (2, 24), (3, 36), ..."
  - id: 4-md-2
    label: "4.MD.2 — Use the four operations to solve word problems involving distances"
    group: 4-md-a
    maturityLevel: grade-4
    description: "Common Core 4.MD.2: Use the four operations to solve word problems involving distances, intervals of time, liquid volumes, masses of objects, and money, including problems involving simple fractions or decimals, and problems that require expressing measurements given in a larger unit in terms of a smaller unit. Represent measurement quantities using diagrams such as number line diagrams that feature a measurement scale."
  - id: 4-md-3
    label: "4.MD.3 — Apply the area and perimeter formulas for rectangles in real world and mathematical…"
    group: 4-md-a
    maturityLevel: grade-4
    description: "Common Core 4.MD.3: Apply the area and perimeter formulas for rectangles in real world and mathematical problems. Clarifications: For example, find the width of a rectangular room given the area of the flooring and the length, by viewing the area formula as a multiplication equation with an unknown factor."
  - id: 4-md-5
    label: "4.MD.5 — Recognize angles as geometric shapes that are formed wherever two rays share a common…"
    group: 4-md-c
    maturityLevel: grade-4
    description: "Common Core 4.MD.5: Recognize angles as geometric shapes that are formed wherever two rays share a common endpoint, and understand concepts of angle measurement: Substandards: undefined. An angle is measured with reference to a circle with its center at the common endpoint of the rays, by considering the fraction of the circular arc between the points where the two rays intersect the circle. An angle that turns through 1/360 of a circle is called a \"one-degree angle,\" and can be used to measure angles. undefined. An angle that turns through n one-degree angles is said to have an angle measure of n degrees."
  - id: 4-md-6
    label: "4.MD.6 — Measure angles in whole-number degrees using a protractor"
    group: 4-md-c
    maturityLevel: grade-4
    description: "Common Core 4.MD.6: Measure angles in whole-number degrees using a protractor. Sketch angles of specified measure."
  - id: 4-md-7
    label: "4.MD.7 — Recognize angle measure as additive"
    group: 4-md-c
    maturityLevel: grade-4
    description: "Common Core 4.MD.7: Recognize angle measure as additive. When an angle is decomposed into non-overlapping parts, the angle measure of the whole is the sum of the angle measures of the parts. Solve addition and subtraction problems to find unknown angles on a diagram in real world and mathematical problems, e.g., by using an equation with a symbol for the unknown angle measure."
  - id: 5-md-1
    label: "5.MD.1 — Convert among different-sized standard measurement units within a given measurement system"
    group: 5-md-a
    maturityLevel: grade-5
    description: "Common Core 5.MD.1: Convert among different-sized standard measurement units within a given measurement system (e.g., convert 5 cm to 0.05 m), and use these conversions in solving multi-step, real world problems."
  - id: 5-md-3
    label: "5.MD.3 — Recognize volume as an attribute of solid figures and understand concepts of volume…"
    group: 5-md-c
    maturityLevel: grade-5
    description: "Common Core 5.MD.3: Recognize volume as an attribute of solid figures and understand concepts of volume measurement. Substandards: a. A cube with side length 1 unit, called a \"unit cube,\" is said to have \"one cubic unit\" of volume, and can be used to measure volume. b. A solid figure which can be packed without gaps or overlaps using n unit cubes is said to have a volume of n cubic units."
  - id: 5-md-4
    label: "5.MD.4 — Measure volumes by counting unit cubes"
    group: 5-md-c
    maturityLevel: grade-5
    description: "Common Core 5.MD.4: Measure volumes by counting unit cubes, using cubic cm, cubic in, cubic ft, and improvised units."
  - id: 5-md-5
    label: "5.MD.5 — Relate volume to the operations of multiplication and addition and solve real world and…"
    group: 5-md-c
    maturityLevel: grade-5
    description: "Common Core 5.MD.5: Relate volume to the operations of multiplication and addition and solve real world and mathematical problems involving volume. Substandards: a. Find the volume of a right rectangular prism with whole-number side lengths by packing it with unit cubes, and show that the volume is the same as would be found by multiplying the edge lengths, equivalently by multiplying the height by the area of the base. Represent threefold whole-number products as volumes, e.g., to represent the associative property of multiplication. b. Apply the formulas V = l × w × h and V = b × h for rectangular prisms to find volumes of right rectangular prisms with whole-number edge lengths in the context of solving real world and mathematical problems. c. Recognize volume as additive. Find volumes of solid figures composed of two non-overlapping right rectangular prisms by adding the volumes of the non-overlapping parts, applying this technique to solve real world problems."
  - id: k-g-1
    label: "K.G.1 — Describe objects in the environment using names of shapes"
    group: k-g-a
    maturityLevel: kindergarten
    description: "Common Core K.G.1: Describe objects in the environment using names of shapes, and describe the relative positions of these objects using terms such as above, below, beside, in front of, behind, and next to."
  - id: k-g-2
    label: "K.G.2 — Correctly name shapes regardless of their orientations or overall size"
    group: k-g-a
    maturityLevel: kindergarten
    description: "Common Core K.G.2: Correctly name shapes regardless of their orientations or overall size."
  - id: k-g-3
    label: "K.G.3 — Identify shapes as two-dimensional"
    group: k-g-a
    maturityLevel: kindergarten
    description: "Common Core K.G.3: Identify shapes as two-dimensional (lying in a plane, \"flat\") or three-dimensional (\"solid\")."
  - id: k-g-4
    label: "K.G.4 — Analyze and compare two- and three-dimensional shapes"
    group: k-g-b
    maturityLevel: kindergarten
    description: "Common Core K.G.4: Analyze and compare two- and three-dimensional shapes, in different sizes and orientations, using informal language to describe their similarities, differences, parts (e.g., number of sides and vertices/\"corners\") and other attributes (e.g., having sides of equal length)."
  - id: k-g-5
    label: "K.G.5 — Model shapes in the world by building shapes from components"
    group: k-g-b
    maturityLevel: kindergarten
    description: "Common Core K.G.5: Model shapes in the world by building shapes from components (e.g., sticks and clay balls) and drawing shapes."
  - id: k-g-6
    label: "K.G.6 — Compose simple shapes to form larger shapes"
    group: k-g-b
    maturityLevel: kindergarten
    description: "Common Core K.G.6: Compose simple shapes to form larger shapes. Clarifications: For example, \"Can you join these two triangles with full sides touching to make a rectangle?\""
  - id: 1-g-1
    label: "1.G.1 — Distinguish between defining attributes"
    group: 1-g-a
    maturityLevel: grade-1
    description: "Common Core 1.G.1: Distinguish between defining attributes (e.g., triangles are closed and three-sided) versus non-defining attributes (e.g., color, orientation, overall size); build and draw shapes to possess defining attributes."
  - id: 1-g-2
    label: "1.G.2 — Compose two-dimensional shapes"
    group: 1-g-a
    maturityLevel: grade-1
    description: "Common Core 1.G.2: Compose two-dimensional shapes (rectangles, squares, trapezoids, triangles, half-circles, and quarter-circles) or three-dimensional shapes (cubes, right rectangular prisms, right circular cones, and right circular cylinders) to create a composite shape, and compose new shapes from the composite shape. Clarifications: Students do not need to learn formal names such as \"right rectangular prism.\""
  - id: 1-g-3
    label: "1.G.3 — Partition circles and rectangles into two and four equal shares"
    group: 1-g-a
    maturityLevel: grade-1
    description: "Common Core 1.G.3: Partition circles and rectangles into two and four equal shares, describe the shares using the words halves, fourths, and quarters, and use the phrases half of, fourth of, and quarter of. Describe the whole as two of, or four of the shares. Understand for these examples that decomposing into more equal shares creates smaller shares."
  - id: 2-g-1
    label: "2.G.1 — Recognize and draw shapes having specified attributes"
    group: 2-g-a
    maturityLevel: grade-2
    description: "Common Core 2.G.1: Recognize and draw shapes having specified attributes, such as a given number of angles or a given number of equal faces. Identify triangles, quadrilaterals, pentagons, hexagons, and cubes. Clarifications: Sizes are compared directly or visually, not compared by measuring."
  - id: 2-g-2
    label: "2.G.2 — Partition a rectangle into rows and columns of same-size squares and count to find the…"
    group: 2-g-a
    maturityLevel: grade-2
    description: "Common Core 2.G.2: Partition a rectangle into rows and columns of same-size squares and count to find the total number of them."
  - id: 2-g-3
    label: "2.G.3 — Partition circles and rectangles into two"
    group: 2-g-a
    maturityLevel: grade-2
    description: "Common Core 2.G.3: Partition circles and rectangles into two, three, or four equal shares, describe the shares using the words halves, thirds, half of, a third of, etc., and describe the whole as two halves, three thirds, four fourths. Recognize that equal shares of identical wholes need not have the same shape."
  - id: 3-g-1
    label: "3.G.1 — Understand that shapes in different categories"
    group: 3-g-a
    maturityLevel: grade-3
    description: "Common Core 3.G.1: Understand that shapes in different categories (e.g., rhombuses, rectangles, and others) may share attributes (e.g., having four sides), and that the shared attributes can define a larger category (e.g., quadrilaterals). Recognize rhombuses, rectangles, and squares as examples of quadrilaterals, and draw examples of quadrilaterals that do not belong to any of these subcategories."
  - id: 3-g-2
    label: "3.G.2 — Partition shapes into parts with equal areas"
    group: 3-g-a
    maturityLevel: grade-3
    description: "Common Core 3.G.2: Partition shapes into parts with equal areas. Express the area of each part as a unit fraction of the whole. Clarifications: For example, partition a shape into 4 parts with equal area, and describe the area of each part as 1/4 of the area of the shape."
  - id: 4-g-1
    label: "4.G.1 — Draw points, lines, line segments, rays, angles (right, acute, obtuse), and…"
    group: 4-g-a
    maturityLevel: grade-4
    description: "Common Core 4.G.1: Draw points, lines, line segments, rays, angles (right, acute, obtuse), and perpendicular and parallel lines. Identify these in two-dimensional figures."
  - id: 4-g-2
    label: "4.G.2 — Classify two-dimensional figures based on the presence or absence of parallel or…"
    group: 4-g-a
    maturityLevel: grade-4
    description: "Common Core 4.G.2: Classify two-dimensional figures based on the presence or absence of parallel or perpendicular lines, or the presence or absence of angles of a specified size. Recognize right triangles as a category, and identify right triangles."
  - id: 4-g-3
    label: "4.G.3 — Recognize a line of symmetry for a two-dimensional figure as a line across the figure…"
    group: 4-g-a
    maturityLevel: grade-4
    description: "Common Core 4.G.3: Recognize a line of symmetry for a two-dimensional figure as a line across the figure such that the figure can be folded along the line into matching parts. Identify line-symmetric figures and draw lines of symmetry."
  - id: 5-g-1
    label: "5.G.1 — Use a pair of perpendicular number lines"
    group: 5-g-a
    maturityLevel: grade-5
    description: "Common Core 5.G.1: Use a pair of perpendicular number lines, called axes, to define a coordinate system, with the intersection of the lines (the origin) arranged to coincide with the 0 on each line and a given point in the plane located by using an ordered pair of numbers, called its coordinates. Understand that the first number indicates how far to travel from the origin in the direction of one axis, and the second number indicates how far to travel in the direction of the second axis, with the convention that the names of the two axes and the coordinates correspond (e.g., x-axis and x-coordinate, y-axis and y-coordinate)."
  - id: 5-g-2
    label: "5.G.2 — Represent real world and mathematical problems by graphing points in the first quadrant…"
    group: 5-g-a
    maturityLevel: grade-5
    description: "Common Core 5.G.2: Represent real world and mathematical problems by graphing points in the first quadrant of the coordinate plane, and interpret coordinate values of points in the context of the situation."
  - id: 5-g-3
    label: "5.G.3 — Understand that attributes belonging to a category of two-dimensional figures also…"
    group: 5-g-b
    maturityLevel: grade-5
    description: "Common Core 5.G.3: Understand that attributes belonging to a category of two-dimensional figures also belong to all subcategories of that category. Clarifications: For example, all rectangles have four right angles and squares are rectangles, so all squares have four right angles."
  - id: 5-g-4
    label: "5.G.4 — Classify two-dimensional figures in a hierarchy based on properties"
    group: 5-g-b
    maturityLevel: grade-5
    description: "Common Core 5.G.4: Classify two-dimensional figures in a hierarchy based on properties."
  - id: 6-g-1
    label: "6.G.1 — Find the area of right triangles, other triangles, special quadrilaterals, and polygons…"
    group: 6-g-a
    maturityLevel: grade-6
    description: "Common Core 6.G.1: Find the area of right triangles, other triangles, special quadrilaterals, and polygons by composing into rectangles or decomposing into triangles and other shapes; apply these techniques in the context of solving real-world and mathematical problems."
  - id: 6-g-2
    label: "6.G.2 — Find the volume of a right rectangular prism with fractional edge lengths by packing it…"
    group: 6-g-a
    maturityLevel: grade-6
    description: "Common Core 6.G.2: Find the volume of a right rectangular prism with fractional edge lengths by packing it with unit cubes of the appropriate unit fraction edge lengths, and show that the volume is the same as would be found by multiplying the edge lengths of the prism. Apply the formulas V = l w h and V = b h to find volumes of right rectangular prisms with fractional edge lengths in the context of solving real-world and mathematical problems."
  - id: 6-g-3
    label: "6.G.3 — Draw polygons in the coordinate plane given coordinates for the vertices"
    group: 6-g-a
    maturityLevel: grade-6
    description: "Common Core 6.G.3: Draw polygons in the coordinate plane given coordinates for the vertices; use coordinates to find the length of a side joining points with the same first coordinate or the same second coordinate. Apply these techniques in the context of solving real-world and mathematical problems."
  - id: 6-g-4
    label: "6.G.4 — Represent three-dimensional figures using nets made up of rectangles and triangles"
    group: 6-g-a
    maturityLevel: grade-6
    description: "Common Core 6.G.4: Represent three-dimensional figures using nets made up of rectangles and triangles, and use the nets to find the surface area of these figures. Apply these techniques in the context of solving real-world and mathematical problems."
  - id: 7-g-1
    label: "7.G.1 — Solve problems involving scale drawings of geometric figures"
    group: 7-g-a
    maturityLevel: grade-7
    description: "Common Core 7.G.1: Solve problems involving scale drawings of geometric figures, including computing actual lengths and areas from a scale drawing and reproducing a scale drawing at a different scale."
  - id: 7-g-2
    label: "7.G.2 — Draw (freehand, with ruler and protractor, and with technology) geometric shapes with…"
    group: 7-g-a
    maturityLevel: grade-7
    description: "Common Core 7.G.2: Draw (freehand, with ruler and protractor, and with technology) geometric shapes with given conditions. Focus on constructing triangles from three measures of angles or sides, noticing when the conditions determine a unique triangle, more than one triangle, or no triangle."
  - id: 7-g-3
    label: "7.G.3 — Describe the two-dimensional figures that result from slicing three-dimensional figures"
    group: 7-g-a
    maturityLevel: grade-7
    description: "Common Core 7.G.3: Describe the two-dimensional figures that result from slicing three-dimensional figures, as in plane sections of right rectangular prisms and right rectangular pyramids."
  - id: 7-g-4
    label: "7.G.4 — Know the formulas for the area and circumference of a circle and use them to solve problems"
    group: 7-g-b
    maturityLevel: grade-7
    description: "Common Core 7.G.4: Know the formulas for the area and circumference of a circle and use them to solve problems; give an informal derivation of the relationship between the circumference and area of a circle."
  - id: 7-g-5
    label: "7.G.5 — Use facts about supplementary, complementary, vertical, and adjacent angles in a…"
    group: 7-g-b
    maturityLevel: grade-7
    description: "Common Core 7.G.5: Use facts about supplementary, complementary, vertical, and adjacent angles in a multi-step problem to write and solve simple equations for an unknown angle in a figure."
  - id: 7-g-6
    label: "7.G.6 — Solve real-world and mathematical problems involving area"
    group: 7-g-b
    maturityLevel: grade-7
    description: "Common Core 7.G.6: Solve real-world and mathematical problems involving area, volume and surface area of two- and three-dimensional objects composed of triangles, quadrilaterals, polygons, cubes, and right prisms."
  - id: 8-g-1
    label: "8.G.1 — Verify experimentally the properties of rotations, reflections, and translations"
    group: 8-g-a
    maturityLevel: grade-8
    description: "Common Core 8.G.1: Verify experimentally the properties of rotations, reflections, and translations: Substandards: undefined. Lines are taken to lines, and line segments to line segments of the same length. undefined. Angles are taken to angles of the same measure. undefined. Parallel lines are taken to parallel lines."
  - id: 8-g-2
    label: "8.G.2 — Understand that a two-dimensional figure is congruent to another if the second can be…"
    group: 8-g-a
    maturityLevel: grade-8
    description: "Common Core 8.G.2: Understand that a two-dimensional figure is congruent to another if the second can be obtained from the first by a sequence of rotations, reflections, and translations; given two congruent figures, describe a sequence that exhibits the congruence between them."
  - id: 8-g-3
    label: "8.G.3 — Describe the effect of dilations, translations, rotations, and reflections on…"
    group: 8-g-a
    maturityLevel: grade-8
    description: "Common Core 8.G.3: Describe the effect of dilations, translations, rotations, and reflections on two-dimensional figures using coordinates."
  - id: 8-g-4
    label: "8.G.4 — Understand that a two-dimensional figure is similar to another if the second can be…"
    group: 8-g-a
    maturityLevel: grade-8
    description: "Common Core 8.G.4: Understand that a two-dimensional figure is similar to another if the second can be obtained from the first by a sequence of rotations, reflections, translations, and dilations; given two similar two-dimensional figures, describe a sequence that exhibits the similarity between them."
  - id: 8-g-5
    label: "8.G.5 — Use informal arguments to establish facts about the angle sum and exterior angle of…"
    group: 8-g-a
    maturityLevel: grade-8
    description: "Common Core 8.G.5: Use informal arguments to establish facts about the angle sum and exterior angle of triangles, about the angles created when parallel lines are cut by a transversal, and the angle-angle criterion for similarity of triangles. Clarifications: For example, arrange three copies of the same triangle so that the sum of the three angles appears to form a line, and give an argument in terms of transversals why this is so."
  - id: 8-g-6
    label: "8.G.6 — Explain a proof of the Pythagorean Theorem and its converse"
    group: 8-g-b
    maturityLevel: grade-8
    description: "Common Core 8.G.6: Explain a proof of the Pythagorean Theorem and its converse."
  - id: 8-g-7
    label: "8.G.7 — Apply the Pythagorean Theorem to determine unknown side lengths in right triangles in…"
    group: 8-g-b
    maturityLevel: grade-8
    description: "Common Core 8.G.7: Apply the Pythagorean Theorem to determine unknown side lengths in right triangles in real-world and mathematical problems in two and three dimensions."
  - id: 8-g-8
    label: "8.G.8 — Apply the Pythagorean Theorem to find the distance between two points in a coordinate…"
    group: 8-g-b
    maturityLevel: grade-8
    description: "Common Core 8.G.8: Apply the Pythagorean Theorem to find the distance between two points in a coordinate system."
  - id: 8-g-9
    label: "8.G.9 — Know the formulas for the volumes of cones"
    group: 8-g-c
    maturityLevel: grade-8
    description: "Common Core 8.G.9: Know the formulas for the volumes of cones, cylinders, and spheres and use them to solve real-world and mathematical problems."
  - id: 3-nf-1
    label: "3.NF.1 — Understand a fraction 1/b as the quantity formed by 1 part when a whole is partitioned…"
    group: 3-nf-a
    maturityLevel: grade-3
    description: "Common Core 3.NF.1: Understand a fraction 1/b as the quantity formed by 1 part when a whole is partitioned into b equal parts; understand a fraction a/b as the quantity formed by a parts of size 1/b."
  - id: 3-nf-2
    label: "3.NF.2 — Understand a fraction as a number on the number line"
    group: 3-nf-a
    maturityLevel: grade-3
    description: "Common Core 3.NF.2: Understand a fraction as a number on the number line; represent fractions on a number line diagram. Substandards: a. Represent a fraction 1/b on a number line diagram by defining the interval from 0 to 1 as the whole and partitioning it into b equal parts. Recognize that each part has size 1/b and that the endpoint of the part based at 0 locates the number 1/b on the number line. b. Represent a fraction a/b on a number line diagram by marking off a lengths 1/b from 0. Recognize that the resulting interval has size a/b and that its endpoint locates the number a/b on the number line."
  - id: 3-nf-3
    label: "3.NF.3 — Explain equivalence of fractions in special cases"
    group: 3-nf-a
    maturityLevel: grade-3
    description: "Common Core 3.NF.3: Explain equivalence of fractions in special cases, and compare fractions by reasoning about their size. Substandards: a. Understand two fractions as equivalent (equal) if they are the same size, or the same point on a number line. b. Recognize and generate simple equivalent fractions, e.g., 1/2 = 2/4, 4/6 = 2/3). Explain why the fractions are equivalent, e.g., by using a visual fraction model. c. Express whole numbers as fractions, and recognize fractions that are equivalent to whole numbers. d. Compare two fractions with the same numerator or the same denominator by reasoning about their size. Recognize that comparisons are valid only when the two fractions refer to the same whole. Record the results of comparisons with the symbols >, =, or <, and justify the conclusions, e.g., by using a visual fraction model."
  - id: 4-nf-1
    label: "4.NF.1 — Explain why a fraction a/b is equivalent to a fraction (n × a)/(n × b) by using visual…"
    group: 4-nf-a
    maturityLevel: grade-4
    description: "Common Core 4.NF.1: Explain why a fraction a/b is equivalent to a fraction (n × a)/(n × b) by using visual fraction models, with attention to how the number and size of the parts differ even though the two fractions themselves are the same size. Use this principle to recognize and generate equivalent fractions."
  - id: 4-nf-2
    label: "4.NF.2 — Compare two fractions with different numerators and different denominators"
    group: 4-nf-a
    maturityLevel: grade-4
    description: "Common Core 4.NF.2: Compare two fractions with different numerators and different denominators, e.g., by creating common denominators or numerators, or by comparing to a benchmark fraction such as 1/2. Recognize that comparisons are valid only when the two fractions refer to the same whole. Record the results of comparisons with symbols >, =, or <, and justify the conclusions, e.g., by using a visual fraction model."
  - id: 4-nf-3
    label: "4.NF.3 — Understand a fraction a/b with a > 1 as a sum of fractions 1/b"
    group: 4-nf-b
    maturityLevel: grade-4
    description: "Common Core 4.NF.3: Understand a fraction a/b with a > 1 as a sum of fractions 1/b. Substandards: a. Understand addition and subtraction of fractions as joining and separating parts referring to the same whole. b. Decompose a fraction into a sum of fractions with the same denominator in more than one way, recording each decomposition by an equation. Justify decompositions, e.g., by using a visual fraction model. c. Add and subtract mixed numbers with like denominators, e.g., by replacing each mixed number with an equivalent fraction, and/or by using properties of operations and the relationship between addition and subtraction. d. Solve word problems involving addition and subtraction of fractions referring to the same whole and having like denominators, e.g., by using visual fraction models and equations to represent the problem."
  - id: 4-nf-4
    label: "4.NF.4 — Apply and extend previous understandings of multiplication to multiply a fraction by a…"
    group: 4-nf-b
    maturityLevel: grade-4
    description: "Common Core 4.NF.4: Apply and extend previous understandings of multiplication to multiply a fraction by a whole number. Substandards: a. Understand a fraction a/b as a multiple of 1/b. b. Understand a multiple of a/b as a multiple of 1/b, and use this understanding to multiply a fraction by a whole number. c. Solve word problems involving multiplication of a fraction by a whole number, e.g., by using visual fraction models and equations to represent the problem."
  - id: 4-nf-5
    label: "4.NF.5 — Express a fraction with denominator 10 as an equivalent fraction with denominator 100"
    group: 4-nf-c
    maturityLevel: grade-4
    description: "Common Core 4.NF.5: Express a fraction with denominator 10 as an equivalent fraction with denominator 100, and use this technique to add two fractions with respective denominators 10 and 100. Clarifications: Students who can generate equivalent fractions can develop strategies for adding fractions with unlike denominators in general. But addition and subtraction with unlike denominators in general is not a requirement at this grade. For example, express 3/10 as 30/100, and add 3/10 + 4/100 = 34/100."
  - id: 4-nf-6
    label: "4.NF.6 — Use decimal notation for fractions with denominators 10 or 100"
    group: 4-nf-c
    maturityLevel: grade-4
    description: "Common Core 4.NF.6: Use decimal notation for fractions with denominators 10 or 100. Clarifications: For example, rewrite 0.62 as 62/100; describe a length as 0.62 meters; locate 0.62 on a number line diagram."
  - id: 4-nf-7
    label: "4.NF.7 — Compare two decimals to hundredths by reasoning about their size"
    group: 4-nf-c
    maturityLevel: grade-4
    description: "Common Core 4.NF.7: Compare two decimals to hundredths by reasoning about their size. Recognize that comparisons are valid only when the two decimals refer to the same whole. Record the results of comparisons with the symbols >, =, or <, and justify the conclusions, e.g., by using a visual model."
  - id: 5-nf-1
    label: "5.NF.1 — Add and subtract fractions with unlike denominators (including mixed numbers) by…"
    group: 5-nf-a
    maturityLevel: grade-5
    description: "Common Core 5.NF.1: Add and subtract fractions with unlike denominators (including mixed numbers) by replacing given fractions with equivalent fractions in such a way as to produce an equivalent sum or difference of fractions with like denominators. Clarifications: For example, 2/3 + 5/4 = 8/12 + 15/12 = 23/12. (In general, a/b + c/d = (ad + bc)/bd.)"
  - id: 5-nf-2
    label: "5.NF.2 — Solve word problems involving addition and subtraction of fractions referring to the…"
    group: 5-nf-a
    maturityLevel: grade-5
    description: "Common Core 5.NF.2: Solve word problems involving addition and subtraction of fractions referring to the same whole, including cases of unlike denominators, e.g., by using visual fraction models or equations to represent the problem. Use benchmark fractions and number sense of fractions to estimate mentally and assess the reasonableness of answers. Clarifications: For example, recognize an incorrect result 2/5 + 1/2 = 3/7, by observing that 3/7 < 1/2."
  - id: 5-nf-3
    label: "5.NF.3 — Interpret a fraction as division of the numerator by the denominator (a/b = a ÷ b)"
    group: 5-nf-b
    maturityLevel: grade-5
    description: "Common Core 5.NF.3: Interpret a fraction as division of the numerator by the denominator (a/b = a ÷ b). Solve word problems involving division of whole numbers leading to answers in the form of fractions or mixed numbers, e.g., by using visual fraction models or equations to represent the problem. Clarifications: For example, interpret 3/4 as the result of dividing 3 by 4, noting that 3/4 multiplied by 4 equals 3, and that when 3 wholes are shared equally among 4 people each person has a share of size 3/4. If 9 people want to share a 50-pound sack of rice equally by weight, how many pounds of rice should each person get? Between what two whole numbers does your answer lie?"
  - id: 5-nf-4
    label: "5.NF.4 — Apply and extend previous understandings of multiplication to multiply a fraction or…"
    group: 5-nf-b
    maturityLevel: grade-5
    description: "Common Core 5.NF.4: Apply and extend previous understandings of multiplication to multiply a fraction or whole number by a fraction. Substandards: a. Interpret the product (a/b) × q as a parts of a partition of q into b equal parts; equivalently, as the result of a sequence of operations a × q ÷ b. b. Find the area of a rectangle with fractional side lengths by tiling it with unit squares of the appropriate unit fraction side lengths, and show that the area is the same as would be found by multiplying the side lengths. Multiply fractional side lengths to find areas of rectangles, and represent fraction products as rectangular areas."
  - id: 5-nf-5
    label: "5.NF.5 — Interpret multiplication as scaling (resizing), by"
    group: 5-nf-b
    maturityLevel: grade-5
    description: "Common Core 5.NF.5: Interpret multiplication as scaling (resizing), by: Substandards: undefined. Comparing the size of a product to the size of one factor on the basis of the size of the other factor, without performing the indicated multiplication. undefined. Explaining why multiplying a given number by a fraction greater than 1 results in a product greater than the given number (recognizing multiplication by whole numbers greater than 1 as a familiar case); explaining why multiplying a given number by a fraction less than 1 results in a product smaller than the given number; and relating the principle of fraction equivalence a/b = (n×a)/(n×b) to the effect of multiplying a/b by 1."
  - id: 5-nf-6
    label: "5.NF.6 — Solve real world problems involving multiplication of fractions and mixed numbers"
    group: 5-nf-b
    maturityLevel: grade-5
    description: "Common Core 5.NF.6: Solve real world problems involving multiplication of fractions and mixed numbers, e.g., by using visual fraction models or equations to represent the problem."
  - id: 5-nf-7
    label: "5.NF.7 — Apply and extend previous understandings of division to divide unit fractions by whole…"
    group: 5-nf-b
    maturityLevel: grade-5
    description: "Common Core 5.NF.7: Apply and extend previous understandings of division to divide unit fractions by whole numbers and whole numbers by unit fractions. Substandards: a. Interpret division of a unit fraction by a non-zero whole number, and compute such quotients. b. Interpret division of a whole number by a unit fraction, and compute such quotients. c. Solve real world problems involving division of unit fractions by non-zero whole numbers and division of whole numbers by unit fractions, e.g., by using visual fraction models and equations to represent the problem. Clarifications: Students able to multiply fractions in general can develop strategies to divide fractions in general, by reasoning about the relationship between multiplication and division. But division of a fraction by a fraction is not a requirement at this grade"
  - id: 6-rp-1
    label: "6.RP.1 — Understand the concept of a ratio and use ratio language to describe a ratio…"
    group: 6-rp-a
    maturityLevel: grade-6
    description: "Common Core 6.RP.1: Understand the concept of a ratio and use ratio language to describe a ratio relationship between two quantities. Clarifications: For example, \"The ratio of wings to beaks in the bird house at the zoo was 2:1, because for every 2 wings there was 1 beak.\" \"For every vote candidate A received, candidate C received nearly three votes.\""
  - id: 6-rp-2
    label: "6.RP.2 — Understand the concept of a unit rate a/b associated with a ratio a:b with b ≠ 0"
    group: 6-rp-a
    maturityLevel: grade-6
    description: "Common Core 6.RP.2: Understand the concept of a unit rate a/b associated with a ratio a:b with b ≠ 0, and use rate language in the context of a ratio relationship. Clarifications: Expectations for unit rates in this grade are limited to non-complex fractions. For example, \"This recipe has a ratio of 3 cups of flour to 4 cups of sugar, so there is 3/4 cup of flour for each cup of sugar.\" \"We paid $75 for 15 hamburgers, which is a rate of $5 per hamburger.\""
  - id: 6-rp-3
    label: "6.RP.3 — Use ratio and rate reasoning to solve real-world and mathematical problems"
    group: 6-rp-a
    maturityLevel: grade-6
    description: "Common Core 6.RP.3: Use ratio and rate reasoning to solve real-world and mathematical problems, e.g., by reasoning about tables of equivalent ratios, tape diagrams, double number line diagrams, or equations. Substandards: a. Make tables of equivalent ratios relating quantities with whole number measurements, find missing values in the tables, and plot the pairs of values on the coordinate plane. Use tables to compare ratios. b. Solve unit rate problems including those involving unit pricing and constant speed. c. Find a percent of a quantity as a rate per 100 (e.g., 30% of a quantity means 30/100 times the quantity); solve problems involving finding the whole, given a part and the percent. d. Use ratio reasoning to convert measurement units; manipulate and transform units appropriately when multiplying or dividing quantities."
  - id: 7-rp-1
    label: "7.RP.1 — Compute unit rates associated with ratios of fractions"
    group: 7-rp-a
    maturityLevel: grade-7
    description: "Common Core 7.RP.1: Compute unit rates associated with ratios of fractions, including ratios of lengths, areas and other quantities measured in like or different units. Clarifications: For example, if a person walks 1/2 mile in each 1/4 hour, compute the unit rate as the complex fraction 1/2/1/4 miles per hour, equivalently 2 miles per hour."
  - id: 7-rp-2
    label: "7.RP.2 — Recognize and represent proportional relationships between quantities"
    group: 7-rp-a
    maturityLevel: grade-7
    description: "Common Core 7.RP.2: Recognize and represent proportional relationships between quantities. Substandards: a. Decide whether two quantities are in a proportional relationship, e.g., by testing for equivalent ratios in a table or graphing on a coordinate plane and observing whether the graph is a straight line through the origin. b. Identify the constant of proportionality (unit rate) in tables, graphs, equations, diagrams, and verbal descriptions of proportional relationships. c. Represent proportional relationships by equations. d. Explain what a point (x, y) on the graph of a proportional relationship means in terms of the situation, with special attention to the points (0, 0) and (1, r) where r is the unit rate."
  - id: 7-rp-3
    label: "7.RP.3 — Use proportional relationships to solve multistep ratio and percent problems"
    group: 7-rp-a
    maturityLevel: grade-7
    description: "Common Core 7.RP.3: Use proportional relationships to solve multistep ratio and percent problems. Clarifications: Examples: simple interest, tax, markups and markdowns, gratuities and commissions, fees, percent increase and decrease, percent error."
  - id: 6-ns-1
    label: "6.NS.1 — Interpret and compute quotients of fractions"
    group: 6-ns-a
    maturityLevel: grade-6
    description: "Common Core 6.NS.1: Interpret and compute quotients of fractions, and solve word problems involving division of fractions by fractions, e.g., by using visual fraction models and equations to represent the problem. Clarifications: For example, create a story context for (2/3) ÷ (3/4) and use a visual fraction model to show the quotient; use the relationship between multiplication and division to explain that (2/3) ÷ (3/4) = 8/9 because 3/4 of 8/9 is 2/3. (In general, (a/b) ÷ (c/d) = ad/bc.) How much chocolate will each person get if 3 people share 1/2 lb of chocolate equally? How many 3/4-cup servings are in 2/3 of a cup of yogurt? How wide is a rectangular strip of land with length 3/4 mi and area 1/2 square mi?"
  - id: 6-ns-2
    label: "6.NS.2 — Fluently divide multi-digit numbers using the standard algorithm"
    group: 6-ns-b
    maturityLevel: grade-6
    description: "Common Core 6.NS.2: Fluently divide multi-digit numbers using the standard algorithm."
  - id: 6-ns-3
    label: "6.NS.3 — Fluently add, subtract, multiply, and divide multi-digit decimals using the standard…"
    group: 6-ns-b
    maturityLevel: grade-6
    description: "Common Core 6.NS.3: Fluently add, subtract, multiply, and divide multi-digit decimals using the standard algorithm for each operation."
  - id: 6-ns-4
    label: "6.NS.4 — Find the greatest common factor of two whole numbers less than or equal to 100 and the…"
    group: 6-ns-b
    maturityLevel: grade-6
    description: "Common Core 6.NS.4: Find the greatest common factor of two whole numbers less than or equal to 100 and the least common multiple of two whole numbers less than or equal to 12. Use the distributive property to express a sum of two whole numbers 1—100 with a common factor as a multiple of a sum of two whole numbers with no common factor. Clarifications: For example, express 36 + 8 as 4 (9 + 2)."
  - id: 6-ns-5
    label: "6.NS.5 — Understand that positive and negative numbers are used together to describe quantities…"
    group: 6-ns-c
    maturityLevel: grade-6
    description: "Common Core 6.NS.5: Understand that positive and negative numbers are used together to describe quantities having opposite directions or values (e.g., temperature above/below zero, elevation above/below sea level, credits/debits, positive/negative electric charge); use positive and negative numbers to represent quantities in real-world contexts, explaining the meaning of 0 in each situation."
  - id: 6-ns-6
    label: "6.NS.6 — Understand a rational number as a point on the number line"
    group: 6-ns-c
    maturityLevel: grade-6
    description: "Common Core 6.NS.6: Understand a rational number as a point on the number line. Extend number line diagrams and coordinate axes familiar from previous grades to represent points on the line and in the plane with negative number coordinates. Substandards: a. Recognize opposite signs of numbers as indicating locations on opposite sides of 0 on the number line; recognize that the opposite of the opposite of a number is the number itself, e.g., —(—3) = 3, and that 0 is its own opposite. b. Understand signs of numbers in ordered pairs as indicating locations in quadrants of the coordinate plane; recognize that when two ordered pairs differ only by signs, the locations of the points are related by reflections across one or both axes. c. Find and position integers and other rational numbers on a horizontal or vertical number line diagram; find and position pairs of integers and other rational numbers on a coordinate plane."
  - id: 6-ns-7
    label: "6.NS.7 — Understand ordering and absolute value of rational numbers"
    group: 6-ns-c
    maturityLevel: grade-6
    description: "Common Core 6.NS.7: Understand ordering and absolute value of rational numbers. Substandards: a. Interpret statements of inequality as statements about the relative position of two numbers on a number line diagram. b. Write, interpret, and explain statements of order for rational numbers in real-world contexts. c. Understand the absolute value of a rational number as its distance from 0 on the number line; interpret absolute value as magnitude for a positive or negative quantity in a real-world situation. d. Distinguish comparisons of absolute value from statements about order."
  - id: 6-ns-8
    label: "6.NS.8 — Solve real-world and mathematical problems by graphing points in all four quadrants of…"
    group: 6-ns-c
    maturityLevel: grade-6
    description: "Common Core 6.NS.8: Solve real-world and mathematical problems by graphing points in all four quadrants of the coordinate plane. Include use of coordinates and absolute value to find distances between points with the same first coordinate or the same second coordinate."
  - id: 7-ns-1
    label: "7.NS.1 — Apply and extend previous understandings of addition and subtraction to add and subtract…"
    group: 7-ns-a
    maturityLevel: grade-7
    description: "Common Core 7.NS.1: Apply and extend previous understandings of addition and subtraction to add and subtract rational numbers; represent addition and subtraction on a horizontal or vertical number line diagram. Substandards: a. Describe situations in which opposite quantities combine to make 0. b. Understand p + q as the number located a distance |q| from p, in the positive or negative direction depending on whether q is positive or negative. Show that a number and its opposite have a sum of 0 (are additive inverses). Interpret sums of rational numbers by describing real-world contexts. c. Understand subtraction of rational numbers as adding the additive inverse, p — q = p + (—q). Show that the distance between two rational numbers on the number line is the absolute value of their difference, and apply this principle in real-world contexts. d. Apply properties of operations as strategies to add and subtract rational numbers."
  - id: 7-ns-2
    label: "7.NS.2 — Apply and extend previous understandings of multiplication and division and of fractions…"
    group: 7-ns-a
    maturityLevel: grade-7
    description: "Common Core 7.NS.2: Apply and extend previous understandings of multiplication and division and of fractions to multiply and divide rational numbers. Substandards: a. Understand that multiplication is extended from fractions to rational numbers by requiring that operations continue to satisfy the properties of operations, particularly the distributive property, leading to products such as (—1)(—1) = 1 and the rules for multiplying signed numbers. Interpret products of rational numbers by describing real-world contexts. b. Understand that integers can be divided, provided that the divisor is not zero, and every quotient of integers (with non-zero divisor) is a rational number. If p and q are integers, then —(p/q) = (—p)/q = p/(—q). Interpret quotients of rational numbers by describing real-world contexts. c. Apply properties of operations as strategies to multiply and divide rational numbers. d. Convert a rational number to a decimal using long division; know that the decimal form of a rational number terminates in 0s or eventually repeats."
  - id: 7-ns-3
    label: "7.NS.3 — Solve real-world and mathematical problems involving the four operations with rational…"
    group: 7-ns-a
    maturityLevel: grade-7
    description: "Common Core 7.NS.3: Solve real-world and mathematical problems involving the four operations with rational numbers. Clarifications: Computations with rational numbers extend the rules for manipulating fractions to complex fractions."
  - id: 8-ns-1
    label: "8.NS.1 — Know that numbers that are not rational are called irrational"
    group: 8-ns-a
    maturityLevel: grade-8
    description: "Common Core 8.NS.1: Know that numbers that are not rational are called irrational. Understand informally that every number has a decimal expansion; for rational numbers show that the decimal expansion repeats eventually, and convert a decimal expansion which repeats eventually into a rational number."
  - id: 8-ns-2
    label: "8.NS.2 — Use rational approximations of irrational numbers to compare the size of irrational numbers"
    group: 8-ns-a
    maturityLevel: grade-8
    description: "Common Core 8.NS.2: Use rational approximations of irrational numbers to compare the size of irrational numbers, locate them approximately on a number line diagram, and estimate the value of expressions (e.g., π²). Clarifications: For example, by truncating the decimal expansion of √2, show that √2 is between 1 and 2, then between 1.4 and 1.5, and explain how to continue on to get better approximations."
  - id: 6-ee-1
    label: "6.EE.1 — Write and evaluate numerical expressions involving whole-number exponents"
    group: 6-ee-a
    maturityLevel: grade-6
    description: "Common Core 6.EE.1: Write and evaluate numerical expressions involving whole-number exponents."
  - id: 6-ee-2
    label: "6.EE.2 — Write, read, and evaluate expressions in which letters stand for numbers"
    group: 6-ee-a
    maturityLevel: grade-6
    description: "Common Core 6.EE.2: Write, read, and evaluate expressions in which letters stand for numbers. Substandards: a. Write expressions that record operations with numbers and with letters standing for numbers. b. Identify parts of an expression using mathematical terms (sum, term, product, factor, quotient, coefficient); view one or more parts of an expression as a single entity. c. Evaluate expressions at specific values of their variables. Include expressions that arise from formulas used in real-world problems. Perform arithmetic operations, including those involving whole-number exponents, in the conventional order when there are no parentheses to specify a particular order (Order of Operations)."
  - id: 6-ee-3
    label: "6.EE.3 — Apply the properties of operations to generate equivalent expressions"
    group: 6-ee-a
    maturityLevel: grade-6
    description: "Common Core 6.EE.3: Apply the properties of operations to generate equivalent expressions. Clarifications: For example, apply the distributive property to the expression 3 (2 + x) to produce the equivalent expression 6 + 3x; apply the distributive property to the expression 24x + 18y to produce the equivalent expression 6 (4x + 3y); apply properties of operations to y + y + y to produce the equivalent expression 3y."
  - id: 6-ee-4
    label: "6.EE.4 — Identify when two expressions are equivalent"
    group: 6-ee-a
    maturityLevel: grade-6
    description: "Common Core 6.EE.4: Identify when two expressions are equivalent (i.e., when the two expressions name the same number regardless of which value is substituted into them). Clarifications: For example, the expressions y + y + y and 3y are equivalent because they name the same number regardless of which number y stands for."
  - id: 6-ee-5
    label: "6.EE.5 — Understand solving an equation or inequality as a process of answering a question"
    group: 6-ee-b
    maturityLevel: grade-6
    description: "Common Core 6.EE.5: Understand solving an equation or inequality as a process of answering a question: which values from a specified set, if any, make the equation or inequality true? Use substitution to determine whether a given number in a specified set makes an equation or inequality true."
  - id: 6-ee-6
    label: "6.EE.6 — Use variables to represent numbers and write expressions when solving a real-world or…"
    group: 6-ee-b
    maturityLevel: grade-6
    description: "Common Core 6.EE.6: Use variables to represent numbers and write expressions when solving a real-world or mathematical problem; understand that a variable can represent an unknown number, or, depending on the purpose at hand, any number in a specified set."
  - id: 6-ee-7
    label: "6.EE.7 — Solve real-world and mathematical problems by writing and solving equations of the form…"
    group: 6-ee-b
    maturityLevel: grade-6
    description: "Common Core 6.EE.7: Solve real-world and mathematical problems by writing and solving equations of the form x + p = q and px = q for cases in which p, q and x are all nonnegative rational numbers."
  - id: 6-ee-8
    label: "6.EE.8 — Write an inequality of the form x > c or x c or x < c have infinitely many solutions"
    group: 6-ee-b
    maturityLevel: grade-6
    description: "Common Core 6.EE.8: Write an inequality of the form x > c or x c or x < c have infinitely many solutions; represent solutions of such inequalities on number line diagrams."
  - id: 6-ee-9
    label: "6.EE.9 — Use variables to represent two quantities in a real-world problem that change in…"
    group: 6-ee-c
    maturityLevel: grade-6
    description: "Common Core 6.EE.9: Use variables to represent two quantities in a real-world problem that change in relationship to one another; write an equation to express one quantity, thought of as the dependent variable, in terms of the other quantity, thought of as the independent variable. Analyze the relationship between the dependent and independent variables using graphs and tables, and relate these to the equation. Clarifications: For example, in a problem involving motion at constant speed, list and graph ordered pairs of distances and times, and write the equation d = 65t to represent the relationship between distance and time."
  - id: 7-ee-1
    label: "7.EE.1 — Apply properties of operations as strategies to add"
    group: 7-ee-a
    maturityLevel: grade-7
    description: "Common Core 7.EE.1: Apply properties of operations as strategies to add, subtract, factor, and expand linear expressions with rational coefficients."
  - id: 7-ee-2
    label: "7.EE.2 — Understand that rewriting an expression in different forms in a problem context can shed…"
    group: 7-ee-a
    maturityLevel: grade-7
    description: "Common Core 7.EE.2: Understand that rewriting an expression in different forms in a problem context can shed light on the problem and how the quantities in it are related. Clarifications: For example, a + 0.05a = 1.05a means that \"increase by 5%\" is the same as \"multiply by 1.05.\""
  - id: 7-ee-3
    label: "7.EE.3 — Solve multi-step real-life and mathematical problems posed with positive and negative…"
    group: 7-ee-b
    maturityLevel: grade-7
    description: "Common Core 7.EE.3: Solve multi-step real-life and mathematical problems posed with positive and negative rational numbers in any form (whole numbers, fractions, and decimals), using tools strategically. Apply properties of operations to calculate with numbers in any form; convert between forms as appropriate; and assess the reasonableness of answers using mental computation and estimation strategies. Clarifications: For example: If a woman making $25 an hour gets a 10% raise, she will make an additional 1/10 of her salary an hour, or $2.50, for a new salary of $27.50. If you want to place a towel bar 9 3/4 inches long in the center of a door that is 27 1/2 inches wide, you will need to place the bar about 9 inches from each edge; this estimate can be used as a check on the exact computation."
  - id: 7-ee-4
    label: "7.EE.4 — Use variables to represent quantities in a real-world or mathematical problem"
    group: 7-ee-b
    maturityLevel: grade-7
    description: "Common Core 7.EE.4: Use variables to represent quantities in a real-world or mathematical problem, and construct simple equations and inequalities to solve problems by reasoning about the quantities. Substandards: a. Solve word problems leading to equations of the form px + q = r and p(x + q) = r, where p, q, and r are specific rational numbers. Solve equations of these forms fluently. Compare an algebraic solution to an arithmetic solution, identifying the sequence of the operations used in each approach. b. Solve word problems leading to inequalities of the form px + q > r or px + q < r, where p, q, and r are specific rational numbers. Graph the solution set of the inequality and interpret it in the context of the problem."
  - id: 8-ee-1
    label: "8.EE.1 — Know and apply the properties of integer exponents to generate equivalent numerical…"
    group: 8-ee-a
    maturityLevel: grade-8
    description: "Common Core 8.EE.1: Know and apply the properties of integer exponents to generate equivalent numerical expressions. Clarifications: For example, 3² × 3-5 = 3-3 = 1/3³ = 1/27."
  - id: 8-ee-2
    label: "8.EE.2 — Use square root and cube root symbols to represent solutions to equations of the form x²…"
    group: 8-ee-a
    maturityLevel: grade-8
    description: "Common Core 8.EE.2: Use square root and cube root symbols to represent solutions to equations of the form x² = p and x³ = p, where p is a positive rational number. Evaluate square roots of small perfect squares and cube roots of small perfect cubes. Know that √2 is irrational."
  - id: 8-ee-3
    label: "8.EE.3 — Use numbers expressed in the form of a single digit times an integer power of 10 to…"
    group: 8-ee-a
    maturityLevel: grade-8
    description: "Common Core 8.EE.3: Use numbers expressed in the form of a single digit times an integer power of 10 to estimate very large or very small quantities, and to express how many times as much one is than the other. Clarifications: For example, estimate the population of the United States as 3 × 108 and the population of the world as 7 × 109, and determine that the world population is more than 20 times larger."
  - id: 8-ee-4
    label: "8.EE.4 — Perform operations with numbers expressed in scientific notation"
    group: 8-ee-a
    maturityLevel: grade-8
    description: "Common Core 8.EE.4: Perform operations with numbers expressed in scientific notation, including problems where both decimal and scientific notation are used. Use scientific notation and choose units of appropriate size for measurements of very large or very small quantities (e.g., use millimeters per year for seafloor spreading). Interpret scientific notation that has been generated by technology."
  - id: 8-ee-5
    label: "8.EE.5 — Graph proportional relationships, interpreting the unit rate as the slope of the graph"
    group: 8-ee-b
    maturityLevel: grade-8
    description: "Common Core 8.EE.5: Graph proportional relationships, interpreting the unit rate as the slope of the graph. Compare two different proportional relationships represented in different ways. Clarifications: For example, compare a distance-time graph to a distance-time equation to determine which of two moving objects has greater speed."
  - id: 8-ee-6
    label: "8.EE.6 — Use similar triangles to explain why the slope m is the same between any two distinct…"
    group: 8-ee-b
    maturityLevel: grade-8
    description: "Common Core 8.EE.6: Use similar triangles to explain why the slope m is the same between any two distinct points on a non-vertical line in the coordinate plane; derive the equation y = mx for a line through the origin and the equation y = mx + b for a line intercepting the vertical axis at b."
  - id: 8-ee-7
    label: "8.EE.7 — Solve linear equations in one variable"
    group: 8-ee-c
    maturityLevel: grade-8
    description: "Common Core 8.EE.7: Solve linear equations in one variable. Substandards: a. Give examples of linear equations in one variable with one solution, infinitely many solutions, or no solutions. Show which of these possibilities is the case by successively transforming the given equation into simpler forms, until an equivalent equation of the form x = a, a = a, or a = b results (where a and b are different numbers). b. Solve linear equations with rational number coefficients, including equations whose solutions require expanding expressions using the distributive property and collecting like terms."
  - id: 8-ee-8
    label: "8.EE.8 — Analyze and solve pairs of simultaneous linear equations"
    group: 8-ee-c
    maturityLevel: grade-8
    description: "Common Core 8.EE.8: Analyze and solve pairs of simultaneous linear equations. Substandards: a. Understand that solutions to a system of two linear equations in two variables correspond to points of intersection of their graphs, because points of intersection satisfy both equations simultaneously. b. Solve systems of two linear equations in two variables algebraically, and estimate solutions by graphing the equations. Solve simple cases by inspection. c. Solve real-world and mathematical problems leading to two linear equations in two variables."
  - id: 6-sp-1
    label: "6.SP.1 — Recognize a statistical question as one that anticipates variability in the data related…"
    group: 6-sp-a
    maturityLevel: grade-6
    description: "Common Core 6.SP.1: Recognize a statistical question as one that anticipates variability in the data related to the question and accounts for it in the answers. Clarifications: For example, \"How old am I?\" is not a statistical question, but \"How old are the students in my school?\" is a statistical question because one anticipates variability in students' ages."
  - id: 6-sp-2
    label: "6.SP.2 — Understand that a set of data collected to answer a statistical question has a…"
    group: 6-sp-a
    maturityLevel: grade-6
    description: "Common Core 6.SP.2: Understand that a set of data collected to answer a statistical question has a distribution which can be described by its center, spread, and overall shape."
  - id: 6-sp-3
    label: "6.SP.3 — Recognize that a measure of center for a numerical data set summarizes all of its values…"
    group: 6-sp-a
    maturityLevel: grade-6
    description: "Common Core 6.SP.3: Recognize that a measure of center for a numerical data set summarizes all of its values with a single number, while a measure of variation describes how its values vary with a single number."
  - id: 6-sp-4
    label: "6.SP.4 — Display numerical data in plots on a number line"
    group: 6-sp-b
    maturityLevel: grade-6
    description: "Common Core 6.SP.4: Display numerical data in plots on a number line, including dot plots, histograms, and box plots."
  - id: 6-sp-5
    label: "6.SP.5 — Summarize numerical data sets in relation to their context, such as by"
    group: 6-sp-b
    maturityLevel: grade-6
    description: "Common Core 6.SP.5: Summarize numerical data sets in relation to their context, such as by: Substandards: undefined. Reporting the number of observations. undefined. Describing the nature of the attribute under investigation, including how it was measured and its units of measurement. undefined. Giving quantitative measures of center (median and/or mean) and variability (interquartile range and/or mean absolute deviation), as well as describing any overall pattern and any striking deviations from the overall pattern with reference to the context in which the data were gathered. undefined. Relating the choice of measures of center and variability to the shape of the data distribution and the context in which the data were gathered."
  - id: 7-sp-1
    label: "7.SP.1 — Understand that statistics can be used to gain information about a population by…"
    group: 7-sp-a
    maturityLevel: grade-7
    description: "Common Core 7.SP.1: Understand that statistics can be used to gain information about a population by examining a sample of the population; generalizations about a population from a sample are valid only if the sample is representative of that population. Understand that random sampling tends to produce representative samples and support valid inferences."
  - id: 7-sp-2
    label: "7.SP.2 — Use data from a random sample to draw inferences about a population with an unknown…"
    group: 7-sp-a
    maturityLevel: grade-7
    description: "Common Core 7.SP.2: Use data from a random sample to draw inferences about a population with an unknown characteristic of interest. Generate multiple samples (or simulated samples) of the same size to gauge the variation in estimates or predictions. Clarifications: For example, estimate the mean word length in a book by randomly sampling words from the book; predict the winner of a school election based on randomly sampled survey data. Gauge how far off the estimate or prediction might be."
  - id: 7-sp-3
    label: "7.SP.3 — Informally assess the degree of visual overlap of two numerical data distributions with…"
    group: 7-sp-b
    maturityLevel: grade-7
    description: "Common Core 7.SP.3: Informally assess the degree of visual overlap of two numerical data distributions with similar variabilities, measuring the difference between the centers by expressing it as a multiple of a measure of variability. Clarifications: For example, the mean height of players on the basketball team is 10 cm greater than the mean height of players on the soccer team, about twice the variability (mean absolute deviation) on either team; on a dot plot, the separation between the two distributions of heights is noticeable."
  - id: 7-sp-4
    label: "7.SP.4 — Use measures of center and measures of variability for numerical data from random…"
    group: 7-sp-b
    maturityLevel: grade-7
    description: "Common Core 7.SP.4: Use measures of center and measures of variability for numerical data from random samples to draw informal comparative inferences about two populations. Clarifications: For example, decide whether the words in a chapter of a seventh-grade science book are generally longer than the words in a chapter of a fourth-grade science book."
  - id: 7-sp-5
    label: "7.SP.5 — Understand that the probability of a chance event is a number between 0 and 1 that…"
    group: 7-sp-c
    maturityLevel: grade-7
    description: "Common Core 7.SP.5: Understand that the probability of a chance event is a number between 0 and 1 that expresses the likelihood of the event occurring. Larger numbers indicate greater likelihood. A probability near 0 indicates an unlikely event, a probability around 1/2 indicates an event that is neither unlikely nor likely, and a probability near 1 indicates a likely event."
  - id: 7-sp-6
    label: "7.SP.6 — Approximate the probability of a chance event by collecting data on the chance process…"
    group: 7-sp-c
    maturityLevel: grade-7
    description: "Common Core 7.SP.6: Approximate the probability of a chance event by collecting data on the chance process that produces it and observing its long-run relative frequency, and predict the approximate relative frequency given the probability. Clarifications: For example, when rolling a number cube 600 times, predict that a 3 or 6 would be rolled roughly 200 times, but probably not exactly 200 times."
  - id: 7-sp-7
    label: "7.SP.7 — Develop a probability model and use it to find probabilities of events"
    group: 7-sp-c
    maturityLevel: grade-7
    description: "Common Core 7.SP.7: Develop a probability model and use it to find probabilities of events. Compare probabilities from a model to observed frequencies; if the agreement is not good, explain possible sources of the discrepancy. Substandards: a. Develop a uniform probability model by assigning equal probability to all outcomes, and use the model to determine probabilities of events. b. Develop a probability model (which may not be uniform) by observing frequencies in data generated from a chance process."
  - id: 7-sp-8
    label: "7.SP.8 — Find probabilities of compound events using organized lists"
    group: 7-sp-c
    maturityLevel: grade-7
    description: "Common Core 7.SP.8: Find probabilities of compound events using organized lists, tables, tree diagrams, and simulation. Substandards: a. Understand that, just as with simple events, the probability of a compound event is the fraction of outcomes in the sample space for which the compound event occurs. b. Represent sample spaces for compound events using methods such as organized lists, tables and tree diagrams. For an event described in everyday language (e.g., \"rolling double sixes\"), identify the outcomes in the sample space which compose the event. c. Design and use a simulation to generate frequencies for compound events."
  - id: 8-sp-1
    label: "8.SP.1 — Construct and interpret scatter plots for bivariate measurement data to investigate…"
    group: 8-sp-a
    maturityLevel: grade-8
    description: "Common Core 8.SP.1: Construct and interpret scatter plots for bivariate measurement data to investigate patterns of association between two quantities. Describe patterns such as clustering, outliers, positive or negative association, linear association, and nonlinear association."
  - id: 8-sp-2
    label: "8.SP.2 — Know that straight lines are widely used to model relationships between two quantitative…"
    group: 8-sp-a
    maturityLevel: grade-8
    description: "Common Core 8.SP.2: Know that straight lines are widely used to model relationships between two quantitative variables. For scatter plots that suggest a linear association, informally fit a straight line, and informally assess the model fit by judging the closeness of the data points to the line."
  - id: 8-sp-3
    label: "8.SP.3 — Use the equation of a linear model to solve problems in the context of bivariate…"
    group: 8-sp-a
    maturityLevel: grade-8
    description: "Common Core 8.SP.3: Use the equation of a linear model to solve problems in the context of bivariate measurement data, interpreting the slope and intercept. Clarifications: For example, in a linear model for a biology experiment, interpret a slope of 1.5 cm/hr as meaning that an additional hour of sunlight each day is associated with an additional 1.5 cm in mature plant height."
  - id: 8-sp-4
    label: "8.SP.4 — Understand that patterns of association can also be seen in bivariate categorical data…"
    group: 8-sp-a
    maturityLevel: grade-8
    description: "Common Core 8.SP.4: Understand that patterns of association can also be seen in bivariate categorical data by displaying frequencies and relative frequencies in a two-way table. Construct and interpret a two-way table summarizing data on two categorical variables collected from the same subjects. Use relative frequencies calculated for rows or columns to describe possible association between the two variables. Clarifications: For example, collect data from students in your class on whether or not they have a curfew on school nights and whether or not they have assigned chores at home. Is there evidence that those who have a curfew also tend to have chores?"
  - id: 8-f-1
    label: "8.F.1 — Understand that a function is a rule that assigns to each input exactly one output"
    group: 8-f-a
    maturityLevel: grade-8
    description: "Common Core 8.F.1: Understand that a function is a rule that assigns to each input exactly one output. The graph of a function is the set of ordered pairs consisting of an input and the corresponding output. Clarifications: Function notation is not required in Grade 8."
  - id: 8-f-2
    label: "8.F.2 — Compare properties of two functions each represented in a different way"
    group: 8-f-a
    maturityLevel: grade-8
    description: "Common Core 8.F.2: Compare properties of two functions each represented in a different way (algebraically, graphically, numerically in tables, or by verbal descriptions). Clarifications: For example, given a linear function represented by a table of values and a linear function represented by an algebraic expression, determine which function has the greater rate of change."
  - id: 8-f-3
    label: "8.F.3 — Interpret the equation y = mx + b as defining a linear function"
    group: 8-f-a
    maturityLevel: grade-8
    description: "Common Core 8.F.3: Interpret the equation y = mx + b as defining a linear function, whose graph is a straight line; give examples of functions that are not linear. Clarifications: For example, the function A = s² giving the area of a square as a function of its side length is not linear because its graph contains the points (1,1), (2,4) and (3,9), which are not on a straight line."
  - id: 8-f-4
    label: "8.F.4 — Construct a function to model a linear relationship between two quantities"
    group: 8-f-b
    maturityLevel: grade-8
    description: "Common Core 8.F.4: Construct a function to model a linear relationship between two quantities. Determine the rate of change and initial value of the function from a description of a relationship or from two (x, y) values, including reading these from a table or from a graph. Interpret the rate of change and initial value of a linear function in terms of the situation it models, and in terms of its graph or a table of values."
  - id: 8-f-5
    label: "8.F.5 — Describe qualitatively the functional relationship between two quantities by analyzing a…"
    group: 8-f-b
    maturityLevel: grade-8
    description: "Common Core 8.F.5: Describe qualitatively the functional relationship between two quantities by analyzing a graph (e.g., where the function is increasing or decreasing, linear or nonlinear). Sketch a graph that exhibits the qualitative features of a function that has been described verbally."
  - id: n-rn-1
    label: "N-RN.1 — Explain how the definition of the meaning of rational exponents follows from extending…"
    group: n-rn-a
    maturityLevel: high-school
    description: "Common Core N-RN.1: Explain how the definition of the meaning of rational exponents follows from extending the properties of integer exponents to those values, allowing for a notation for radicals in terms of rational exponents. Clarifications: For example, we define 51/3 to be the cube root of 5 because we want (51/3)³ = 5(1/3)³ to hold, so (51/3)³ must equal 5."
  - id: n-rn-2
    label: "N-RN.2 — Rewrite expressions involving radicals and rational exponents using the properties of…"
    group: n-rn-a
    maturityLevel: high-school
    description: "Common Core N-RN.2: Rewrite expressions involving radicals and rational exponents using the properties of exponents."
  - id: n-rn-3
    label: "N-RN.3 — Explain why the sum or product of two rational numbers is rational"
    group: n-rn-b
    maturityLevel: high-school
    description: "Common Core N-RN.3: Explain why the sum or product of two rational numbers is rational; that the sum of a rational number and an irrational number is irrational; and that the product of a nonzero rational number and an irrational number is irrational."
  - id: n-q-1
    label: "N-Q.1 — Use units as a way to understand problems and to guide the solution of multi-step problems"
    group: n-q-a
    maturityLevel: high-school
    description: "Common Core N-Q.1: Use units as a way to understand problems and to guide the solution of multi-step problems; choose and interpret units consistently in formulas; choose and interpret the scale and the origin in graphs and data displays."
  - id: n-q-2
    label: "N-Q.2 — Define appropriate quantities for the purpose of descriptive modeling"
    group: n-q-a
    maturityLevel: high-school
    description: "Common Core N-Q.2: Define appropriate quantities for the purpose of descriptive modeling."
  - id: n-q-3
    label: "N-Q.3 — Choose a level of accuracy appropriate to limitations on measurement when reporting…"
    group: n-q-a
    maturityLevel: high-school
    description: "Common Core N-Q.3: Choose a level of accuracy appropriate to limitations on measurement when reporting quantities."
  - id: n-cn-1
    label: "N-CN.1 — Know there is a complex number i such that i² = —1"
    group: n-cn-a
    maturityLevel: high-school
    description: "Common Core N-CN.1: Know there is a complex number i such that i² = —1, and every complex number has the form a + bi with a and b real."
  - id: n-cn-2
    label: "N-CN.2 — Use the relation i² = —1 and the commutative"
    group: n-cn-a
    maturityLevel: high-school
    description: "Common Core N-CN.2: Use the relation i² = —1 and the commutative, associative, and distributive properties to add, subtract, and multiply complex numbers."
  - id: n-cn-3
    label: "N-CN.3 (+) — Find the conjugate of a complex number"
    group: n-cn-a
    maturityLevel: high-school
    description: "Common Core N-CN.3: (+) Find the conjugate of a complex number; use conjugates to find moduli and quotients of complex numbers."
  - id: n-cn-4
    label: "N-CN.4 (+) — Represent complex numbers on the complex plane in rectangular and polar form"
    group: n-cn-b
    maturityLevel: high-school
    description: "Common Core N-CN.4: (+) Represent complex numbers on the complex plane in rectangular and polar form (including real and imaginary numbers), and explain why the rectangular and polar forms of a given complex number represent the same number."
  - id: n-cn-5
    label: "N-CN.5 (+) — Represent addition, subtraction, multiplication, and conjugation of complex numbers…"
    group: n-cn-b
    maturityLevel: high-school
    description: "Common Core N-CN.5: (+) Represent addition, subtraction, multiplication, and conjugation of complex numbers geometrically on the complex plane; use properties of this representation for computation. Clarifications: For example, (-1 + √3 i)³ = 8 because (-1 + √3 i) has modulus 2 and argument 120°."
  - id: n-cn-6
    label: "N-CN.6 (+) — Calculate the distance between numbers in the complex plane as the modulus of the difference"
    group: n-cn-b
    maturityLevel: high-school
    description: "Common Core N-CN.6: (+) Calculate the distance between numbers in the complex plane as the modulus of the difference, and the midpoint of a segment as the average of the numbers at its endpoints."
  - id: n-cn-7
    label: "N-CN.7 — Solve quadratic equations with real coefficients that have complex solutions"
    group: n-cn-c
    maturityLevel: high-school
    description: "Common Core N-CN.7: Solve quadratic equations with real coefficients that have complex solutions."
  - id: n-cn-8
    label: "N-CN.8 (+) — Extend polynomial identities to the complex numbers"
    group: n-cn-c
    maturityLevel: high-school
    description: "Common Core N-CN.8: (+) Extend polynomial identities to the complex numbers. Clarifications: For example, rewrite x² + 4 as (x + 2i)(x - 2i)."
  - id: n-cn-9
    label: "N-CN.9 (+) — Know the Fundamental Theorem of Algebra; show that it is true for quadratic polynomials"
    group: n-cn-c
    maturityLevel: high-school
    description: "Common Core N-CN.9: (+) Know the Fundamental Theorem of Algebra; show that it is true for quadratic polynomials."
  - id: n-vm-1
    label: "N-VM.1 (+) — Recognize vector quantities as having both magnitude and direction"
    group: n-vm-a
    maturityLevel: high-school
    description: "Common Core N-VM.1: (+) Recognize vector quantities as having both magnitude and direction. Represent vector quantities by directed line segments, and use appropriate symbols for vectors and their magnitudes (e.g., v, |v|, ||v||, v)."
  - id: n-vm-2
    label: "N-VM.2 (+) — Find the components of a vector by subtracting the coordinates of an initial point from…"
    group: n-vm-a
    maturityLevel: high-school
    description: "Common Core N-VM.2: (+) Find the components of a vector by subtracting the coordinates of an initial point from the coordinates of a terminal point."
  - id: n-vm-3
    label: "N-VM.3 (+) — Solve problems involving velocity and other quantities that can be represented by vectors"
    group: n-vm-a
    maturityLevel: high-school
    description: "Common Core N-VM.3: (+) Solve problems involving velocity and other quantities that can be represented by vectors."
  - id: n-vm-4
    label: "N-VM.4 (+) — Add and subtract vectors"
    group: n-vm-b
    maturityLevel: high-school
    description: "Common Core N-VM.4: (+) Add and subtract vectors. Substandards: a. Add vectors end-to-end, component-wise, and by the parallelogram rule. Understand that the magnitude of a sum of two vectors is typically not the sum of the magnitudes. b. Given two vectors in magnitude and direction form, determine the magnitude and direction of their sum. c. Understand vector subtraction v — w as v + (—w), where —w is the additive inverse of w, with the same magnitude as w and pointing in the opposite direction. Represent vector subtraction graphically by connecting the tips in the appropriate order, and perform vector subtraction component-wise."
  - id: n-vm-5
    label: "N-VM.5 (+) — Multiply a vector by a scalar"
    group: n-vm-b
    maturityLevel: high-school
    description: "Common Core N-VM.5: (+) Multiply a vector by a scalar. Substandards: a. Represent scalar multiplication graphically by scaling vectors and possibly reversing their direction; perform scalar multiplication component-wise, e.g., as c(vx, vy) = (cvx, cvy). b. Compute the magnitude of a scalar multiple cv using ||cv|| = |c|v. Compute the direction of cv knowing that when |c|v ? 0, the direction of cv is either along v (for c > 0) or against v (for c < 0)."
  - id: n-vm-6
    label: "N-VM.6 (+) — Use matrices to represent and manipulate data"
    group: n-vm-c
    maturityLevel: high-school
    description: "Common Core N-VM.6: (+) Use matrices to represent and manipulate data, e.g., to represent payoffs or incidence relationships in a network."
  - id: n-vm-7
    label: "N-VM.7 (+) — Multiply matrices by scalars to produce new matrices"
    group: n-vm-c
    maturityLevel: high-school
    description: "Common Core N-VM.7: (+) Multiply matrices by scalars to produce new matrices, e.g., as when all of the payoffs in a game are doubled."
  - id: n-vm-8
    label: "N-VM.8 (+) — Add, subtract, and multiply matrices of appropriate dimensions"
    group: n-vm-c
    maturityLevel: high-school
    description: "Common Core N-VM.8: (+) Add, subtract, and multiply matrices of appropriate dimensions."
  - id: n-vm-9
    label: "N-VM.9 (+) — Understand that, unlike multiplication of numbers, matrix multiplication for square…"
    group: n-vm-c
    maturityLevel: high-school
    description: "Common Core N-VM.9: (+) Understand that, unlike multiplication of numbers, matrix multiplication for square matrices is not a commutative operation, but still satisfies the associative and distributive properties."
  - id: n-vm-10
    label: "N-VM.10 (+) — Understand that the zero and identity matrices play a role in matrix addition and…"
    group: n-vm-c
    maturityLevel: high-school
    description: "Common Core N-VM.10: (+) Understand that the zero and identity matrices play a role in matrix addition and multiplication similar to the role of 0 and 1 in the real numbers. The determinant of a square matrix is nonzero if and only if the matrix has a multiplicative inverse."
  - id: n-vm-11
    label: "N-VM.11 (+) — Multiply a vector (regarded as a matrix with one column) by a matrix of suitable…"
    group: n-vm-c
    maturityLevel: high-school
    description: "Common Core N-VM.11: (+) Multiply a vector (regarded as a matrix with one column) by a matrix of suitable dimensions to produce another vector. Work with matrices as transformations of vectors."
  - id: n-vm-12
    label: "N-VM.12 (+) — Work with 2 × 2 matrices as transformations of the plane"
    group: n-vm-c
    maturityLevel: high-school
    description: "Common Core N-VM.12: (+) Work with 2 × 2 matrices as transformations of the plane, and interpret the absolute value of the determinant in terms of area."
  - id: a-sse-1
    label: "A-SSE.1 — Interpret expressions that represent a quantity in terms of its context"
    group: a-sse-a
    maturityLevel: high-school
    description: "Common Core A-SSE.1: Interpret expressions that represent a quantity in terms of its context ★ Substandards: a. Interpret parts of an expression, such as terms, factors, and coefficients. b. Interpret complicated expressions by viewing one or more of their parts as a single entity."
  - id: a-sse-2
    label: "A-SSE.2 — Use the structure of an expression to identify ways to rewrite it"
    group: a-sse-a
    maturityLevel: high-school
    description: "Common Core A-SSE.2: Use the structure of an expression to identify ways to rewrite it. Clarifications: For example, see x4 — y4 as (x²)² — (y²)², thus recognizing it as a difference of squares that can be factored as (x² — y²)(x² + y²)."
  - id: a-sse-3
    label: "A-SSE.3 — Choose and produce an equivalent form of an expression to reveal and explain properties…"
    group: a-sse-b
    maturityLevel: high-school
    description: "Common Core A-SSE.3: Choose and produce an equivalent form of an expression to reveal and explain properties of the quantity represented by the expression.★ Substandards: a. Factor a quadratic expression to reveal the zeros of the function it defines. b. Complete the square in a quadratic expression to reveal the maximum or minimum value of the function it defines. c. Use the properties of exponents to transform expressions for exponential functions."
  - id: a-sse-4
    label: "A-SSE.4 — Derive the formula for the sum of a finite geometric series (when the common ratio is not 1)"
    group: a-sse-b
    maturityLevel: high-school
    description: "Common Core A-SSE.4: Derive the formula for the sum of a finite geometric series (when the common ratio is not 1), and use the formula to solve problems.★ Clarifications: For example, calculate mortgage payments."
  - id: a-apr-1
    label: "A-APR.1 — Understand that polynomials form a system analogous to the integers"
    group: a-apr-a
    maturityLevel: high-school
    description: "Common Core A-APR.1: Understand that polynomials form a system analogous to the integers, namely, they are closed under the operations of addition, subtraction, and multiplication; add, subtract, and multiply polynomials."
  - id: a-apr-2
    label: "A-APR.2 — Know and apply the Remainder Theorem: For a polynomial p(x) and a number a"
    group: a-apr-b
    maturityLevel: high-school
    description: "Common Core A-APR.2: Know and apply the Remainder Theorem: For a polynomial p(x) and a number a, the remainder on division by x — a is p(a), so p(a) = 0 if and only if (x — a) is a factor of p(x)."
  - id: a-apr-3
    label: "A-APR.3 — Identify zeros of polynomials when suitable factorizations are available"
    group: a-apr-b
    maturityLevel: high-school
    description: "Common Core A-APR.3: Identify zeros of polynomials when suitable factorizations are available, and use the zeros to construct a rough graph of the function defined by the polynomial."
  - id: a-apr-4
    label: "A-APR.4 — Prove polynomial identities and use them to describe numerical relationships"
    group: a-apr-c
    maturityLevel: high-school
    description: "Common Core A-APR.4: Prove polynomial identities and use them to describe numerical relationships. Clarifications: For example, the polynomial identity (x² + y²)2 = (x² — y²)² + (2xy)² can be used to generate Pythagorean triples."
  - id: a-apr-5
    label: "A-APR.5 (+) — Know and apply the Binomial Theorem for the expansion of (x + y)n in powers of x and y…"
    group: a-apr-c
    maturityLevel: high-school
    description: "Common Core A-APR.5: (+) Know and apply the Binomial Theorem for the expansion of (x + y)n in powers of x and y for a positive integer n, where x and y are any numbers, with coefficients determined for example by Pascal's Triangle. Clarifications: The Binomial Theorem can be proved by mathematical induction or by a combinatorial argument."
  - id: a-apr-6
    label: "A-APR.6 — Rewrite simple rational expressions in different forms"
    group: a-apr-d
    maturityLevel: high-school
    description: "Common Core A-APR.6: Rewrite simple rational expressions in different forms; write a(x /b(x) in the form q(x) + r(x)/b(x), where a(x), b(x), q(x), and r(x) are polynomials with the degree of r(x) less than the degree of b(x), using inspection, long division, or, for the more complicated examples, a computer algebra system."
  - id: a-apr-7
    label: "A-APR.7 (+) — Understand that rational expressions form a system analogous to the rational numbers"
    group: a-apr-d
    maturityLevel: high-school
    description: "Common Core A-APR.7: (+) Understand that rational expressions form a system analogous to the rational numbers, closed under addition, subtraction, multiplication, and division by a nonzero rational expression; add, subtract, multiply, and divide rational expressions."
  - id: a-ced-1
    label: "A-CED.1 — Create equations and inequalities in one variable and use them to solve problems"
    group: a-ced-a
    maturityLevel: high-school
    description: "Common Core A-CED.1: Create equations and inequalities in one variable and use them to solve problems. Include equations arising from linear and quadratic functions, and simple rational and exponential functions."
  - id: a-ced-2
    label: "A-CED.2 — Create equations in two or more variables to represent relationships between quantities"
    group: a-ced-a
    maturityLevel: high-school
    description: "Common Core A-CED.2: Create equations in two or more variables to represent relationships between quantities; graph equations on coordinate axes with labels and scales."
  - id: a-ced-3
    label: "A-CED.3 — Represent constraints by equations or inequalities"
    group: a-ced-a
    maturityLevel: high-school
    description: "Common Core A-CED.3: Represent constraints by equations or inequalities, and by systems of equations and/or inequalities, and interpret solutions as viable or nonviable options in a modeling context. Clarifications: For example, represent inequalities describing nutritional and cost constraints on combinations of different foods."
  - id: a-ced-4
    label: "A-CED.4 — Rearrange formulas to highlight a quantity of interest"
    group: a-ced-a
    maturityLevel: high-school
    description: "Common Core A-CED.4: Rearrange formulas to highlight a quantity of interest, using the same reasoning as in solving equations. Clarifications: For example, rearrange Ohm's law V = IR to highlight resistance R."
  - id: a-rei-1
    label: "A-REI.1 — Explain each step in solving a simple equation as following from the equality of numbers…"
    group: a-rei-a
    maturityLevel: high-school
    description: "Common Core A-REI.1: Explain each step in solving a simple equation as following from the equality of numbers asserted at the previous step, starting from the assumption that the original equation has a solution. Construct a viable argument to justify a solution method."
  - id: a-rei-2
    label: "A-REI.2 — Solve simple rational and radical equations in one variable"
    group: a-rei-a
    maturityLevel: high-school
    description: "Common Core A-REI.2: Solve simple rational and radical equations in one variable, and give examples showing how extraneous solutions may arise."
  - id: a-rei-3
    label: "A-REI.3 — Solve linear equations and inequalities in one variable"
    group: a-rei-b
    maturityLevel: high-school
    description: "Common Core A-REI.3: Solve linear equations and inequalities in one variable, including equations with coefficients represented by letters."
  - id: a-rei-4
    label: "A-REI.4 — Solve quadratic equations in one variable"
    group: a-rei-b
    maturityLevel: high-school
    description: "Common Core A-REI.4: Solve quadratic equations in one variable. Substandards: a. Use the method of completing the square to transform any quadratic equation in x into an equation of the form (x — p)² = q that has the same solutions. Derive the quadratic formula from this form. b. Solve quadratic equations by inspection (e.g., for x² = 49), taking square roots, completing the square, the quadratic formula and factoring, as appropriate to the initial form of the equation. Recognize when the quadratic formula gives complex solutions and write them as a ± bi for real numbers a and b."
  - id: a-rei-5
    label: "A-REI.5 — Prove that, given a system of two equations in two variables, replacing one equation by…"
    group: a-rei-c
    maturityLevel: high-school
    description: "Common Core A-REI.5: Prove that, given a system of two equations in two variables, replacing one equation by the sum of that equation and a multiple of the other produces a system with the same solutions."
  - id: a-rei-6
    label: "A-REI.6 — Solve systems of linear equations exactly and approximately"
    group: a-rei-c
    maturityLevel: high-school
    description: "Common Core A-REI.6: Solve systems of linear equations exactly and approximately (e.g., with graphs), focusing on pairs of linear equations in two variables."
  - id: a-rei-7
    label: "A-REI.7 — Solve a simple system consisting of a linear equation and a quadratic equation in two…"
    group: a-rei-c
    maturityLevel: high-school
    description: "Common Core A-REI.7: Solve a simple system consisting of a linear equation and a quadratic equation in two variables algebraically and graphically. Clarifications: For example, find the points of intersection between the line y = -3x and the circle x² + y² = 3."
  - id: a-rei-8
    label: "A-REI.8 (+) — Represent a system of linear equations as a single matrix equation in a vector variable"
    group: a-rei-c
    maturityLevel: high-school
    description: "Common Core A-REI.8: (+) Represent a system of linear equations as a single matrix equation in a vector variable."
  - id: a-rei-9
    label: "A-REI.9 (+) — Find the inverse of a matrix if it exists and use it to solve systems of linear…"
    group: a-rei-c
    maturityLevel: high-school
    description: "Common Core A-REI.9: (+) Find the inverse of a matrix if it exists and use it to solve systems of linear equations (using technology for matrices of dimension 3 × 3 or greater)."
  - id: a-rei-10
    label: "A-REI.10 — Understand that the graph of an equation in two variables is the set of all its…"
    group: a-rei-d
    maturityLevel: high-school
    description: "Common Core A-REI.10: Understand that the graph of an equation in two variables is the set of all its solutions plotted in the coordinate plane, often forming a curve (which could be a line)."
  - id: a-rei-11
    label: "A-REI.11 — Explain why the x-coordinates of the points where the graphs of the equations y = f(x)…"
    group: a-rei-d
    maturityLevel: high-school
    description: "Common Core A-REI.11: Explain why the x-coordinates of the points where the graphs of the equations y = f(x) and y = g(x) intersect are the solutions of the equation f(x) = g(x); find the solutions approximately, e.g., using technology to graph the functions, make tables of values, or find successive approximations. Include cases where f(x) and/or g(x) are linear, polynomial, rational, absolute value, exponential, and logarithmic functions.★"
  - id: a-rei-12
    label: "A-REI.12 — Graph the solutions to a linear inequality in two variables as a half-plane"
    group: a-rei-d
    maturityLevel: high-school
    description: "Common Core A-REI.12: Graph the solutions to a linear inequality in two variables as a half-plane (excluding the boundary in the case of a strict inequality), and graph the solution set to a system of linear inequalities in two variables as the intersection of the corresponding half-planes."
  - id: f-if-1
    label: "F-IF.1 — Understand that a function from one set (called the domain) to another set"
    group: f-if-a
    maturityLevel: high-school
    description: "Common Core F-IF.1: Understand that a function from one set (called the domain) to another set (called the range) assigns to each element of the domain exactly one element of the range. If f is a function and x is an element of its domain, then f(x) denotes the output of f corresponding to the input x. The graph of f is the graph of the equation y = f(x)."
  - id: f-if-2
    label: "F-IF.2 — Use function notation, evaluate functions for inputs in their domains, and interpret…"
    group: f-if-a
    maturityLevel: high-school
    description: "Common Core F-IF.2: Use function notation, evaluate functions for inputs in their domains, and interpret statements that use function notation in terms of a context."
  - id: f-if-3
    label: "F-IF.3 — Recognize that sequences are functions"
    group: f-if-a
    maturityLevel: high-school
    description: "Common Core F-IF.3: Recognize that sequences are functions, sometimes defined recursively, whose domain is a subset of the integers. Clarifications: For example, the Fibonacci sequence is defined recursively by f(0) = f(1) = 1, f(n+1) = f(n) + f(n-1) for n ≥ 1."
  - id: f-if-4
    label: "F-IF.4 — For a function that models a relationship between two quantities"
    group: f-if-b
    maturityLevel: high-school
    description: "Common Core F-IF.4: For a function that models a relationship between two quantities, interpret key features of graphs and tables in terms of the quantities, and sketch graphs showing key features given a verbal description of the relationship.★ Clarifications: Key features include: intercepts; intervals where the function is increasing, decreasing, positive, or negative; relative maximums and minimums; symmetries; end behavior; and periodicity."
  - id: f-if-5
    label: "F-IF.5 — Relate the domain of a function to its graph and"
    group: f-if-b
    maturityLevel: high-school
    description: "Common Core F-IF.5: Relate the domain of a function to its graph and, where applicable, to the quantitative relationship it describes.★ Clarifications: For example, if the function h(n) gives the number of person-hours it takes to assemble n engines in a factory, then the positive integers would be an appropriate domain for the function."
  - id: f-if-6
    label: "F-IF.6 — Calculate and interpret the average rate of change of a function"
    group: f-if-b
    maturityLevel: high-school
    description: "Common Core F-IF.6: Calculate and interpret the average rate of change of a function (presented symbolically or as a table) over a specified interval. Estimate the rate of change from a graph.★"
  - id: f-if-7
    label: "F-IF.7 — Graph functions expressed symbolically and show key features of the graph"
    group: f-if-c
    maturityLevel: high-school
    description: "Common Core F-IF.7: Graph functions expressed symbolically and show key features of the graph, by hand in simple cases and using technology for more complicated cases.★ Substandards: a. Graph linear and quadratic functions and show intercepts, maxima, and minima. b. Graph square root, cube root, and piecewise-defined functions, including step functions and absolute value functions. c. Graph polynomial functions, identifying zeros when suitable factorizations are available, and showing end behavior. d. (+) Graph rational functions, identifying zeros and asymptotes when suitable factorizations are available, and showing end behavior. e. Graph exponential and logarithmic functions, showing intercepts and end behavior, and trigonometric functions, showing period, midline, and amplitude."
  - id: f-if-8
    label: "F-IF.8 — Write a function defined by an expression in different but equivalent forms to reveal…"
    group: f-if-c
    maturityLevel: high-school
    description: "Common Core F-IF.8: Write a function defined by an expression in different but equivalent forms to reveal and explain different properties of the function. Substandards: a. Use the process of factoring and completing the square in a quadratic function to show zeros, extreme values, and symmetry of the graph, and interpret these in terms of a context. b. Use the properties of exponents to interpret expressions for exponential functions."
  - id: f-if-9
    label: "F-IF.9 — Compare properties of two functions each represented in a different way"
    group: f-if-c
    maturityLevel: high-school
    description: "Common Core F-IF.9: Compare properties of two functions each represented in a different way (algebraically, graphically, numerically in tables, or by verbal descriptions). Clarifications: For example, given a graph of one quadratic function and an algebraic expression for another, say which has the larger maximum."
  - id: f-bf-1
    label: "F-BF.1 — Write a function that describes a relationship between two quantities"
    group: f-bf-a
    maturityLevel: high-school
    description: "Common Core F-BF.1: Write a function that describes a relationship between two quantities ★ Substandards: a. Determine an explicit expression, a recursive process, or steps for calculation from a context. b. Combine standard function types using arithmetic operations. c. (+) Compose functions."
  - id: f-bf-2
    label: "F-BF.2 — Write arithmetic and geometric sequences both recursively and with an explicit formula"
    group: f-bf-a
    maturityLevel: high-school
    description: "Common Core F-BF.2: Write arithmetic and geometric sequences both recursively and with an explicit formula, use them to model situations, and translate between the two forms.★"
  - id: f-bf-3
    label: "F-BF.3 — Identify the effect on the graph of replacing f(x) by f(x) + k"
    group: f-bf-b
    maturityLevel: high-school
    description: "Common Core F-BF.3: Identify the effect on the graph of replacing f(x) by f(x) + k, k f(x), f(kx), and f(x + k) for specific values of k (both positive and negative); find the value of k given the graphs. Experiment with cases and illustrate an explanation of the effects on the graph using technology. Include recognizing even and odd functions from their graphs and algebraic expressions for them."
  - id: f-bf-4
    label: "F-BF.4 — Find inverse functions"
    group: f-bf-b
    maturityLevel: high-school
    description: "Common Core F-BF.4: Find inverse functions. Substandards: a. Solve an equation of the form f(x) = c for a simple function f that has an inverse and write an expression for the inverse. b. (+) Verify by composition that one function is the inverse of another. c. (+) Read values of an inverse function from a graph or a table, given that the function has an inverse. d. (+) Produce an invertible function from a non-invertible function by restricting the domain."
  - id: f-bf-5
    label: "F-BF.5 (+) — Understand the inverse relationship between exponents and logarithms and use this…"
    group: f-bf-b
    maturityLevel: high-school
    description: "Common Core F-BF.5: (+) Understand the inverse relationship between exponents and logarithms and use this relationship to solve problems involving logarithms and exponents."
  - id: f-le-1
    label: "F-LE.1 — Distinguish between situations that can be modeled with linear functions and with…"
    group: f-le-a
    maturityLevel: high-school
    description: "Common Core F-LE.1: Distinguish between situations that can be modeled with linear functions and with exponential functions. Substandards: a. Prove that linear functions grow by equal differences over equal intervals, and that exponential functions grow by equal factors over equal intervals. b. Recognize situations in which one quantity changes at a constant rate per unit interval relative to another. c. Recognize situations in which a quantity grows or decays by a constant percent rate per unit interval relative to another."
  - id: f-le-2
    label: "F-LE.2 — Construct linear and exponential functions"
    group: f-le-a
    maturityLevel: high-school
    description: "Common Core F-LE.2: Construct linear and exponential functions, including arithmetic and geometric sequences, given a graph, a description of a relationship, or two input-output pairs (include reading these from a table)."
  - id: f-le-3
    label: "F-LE.3 — Observe using graphs and tables that a quantity increasing exponentially eventually…"
    group: f-le-a
    maturityLevel: high-school
    description: "Common Core F-LE.3: Observe using graphs and tables that a quantity increasing exponentially eventually exceeds a quantity increasing linearly, quadratically, or (more generally) as a polynomial function."
  - id: f-le-4
    label: "F-LE.4 — For exponential models, express as a logarithm the solution to abct = d where a, c, and…"
    group: f-le-a
    maturityLevel: high-school
    description: "Common Core F-LE.4: For exponential models, express as a logarithm the solution to abct = d where a, c, and d are numbers and the base b is 2, 10, or e; evaluate the logarithm using technology."
  - id: f-le-5
    label: "F-LE.5 — Interpret the parameters in a linear or exponential function in terms of a context"
    group: f-le-b
    maturityLevel: high-school
    description: "Common Core F-LE.5: Interpret the parameters in a linear or exponential function in terms of a context."
  - id: f-tf-1
    label: "F-TF.1 — Understand radian measure of an angle as the length of the arc on the unit circle…"
    group: f-tf-a
    maturityLevel: high-school
    description: "Common Core F-TF.1: Understand radian measure of an angle as the length of the arc on the unit circle subtended by the angle."
  - id: f-tf-2
    label: "F-TF.2 — Explain how the unit circle in the coordinate plane enables the extension of…"
    group: f-tf-a
    maturityLevel: high-school
    description: "Common Core F-TF.2: Explain how the unit circle in the coordinate plane enables the extension of trigonometric functions to all real numbers, interpreted as radian measures of angles traversed counterclockwise around the unit circle."
  - id: f-tf-3
    label: "F-TF.3 (+) — Use special triangles to determine geometrically the values of sine"
    group: f-tf-a
    maturityLevel: high-school
    description: "Common Core F-TF.3: (+) Use special triangles to determine geometrically the values of sine, cosine, tangent for π/3, π/4 and π/6, and use the unit circle to express the values of sine, cosine, and tangent for π—x, π+x, and 2π—x in terms of their values for x, where x is any real number."
  - id: f-tf-4
    label: "F-TF.4 (+) — Use the unit circle to explain symmetry (odd and even) and periodicity of trigonometric…"
    group: f-tf-a
    maturityLevel: high-school
    description: "Common Core F-TF.4: (+) Use the unit circle to explain symmetry (odd and even) and periodicity of trigonometric functions."
  - id: f-tf-5
    label: "F-TF.5 — Choose trigonometric functions to model periodic phenomena with specified amplitude"
    group: f-tf-b
    maturityLevel: high-school
    description: "Common Core F-TF.5: Choose trigonometric functions to model periodic phenomena with specified amplitude, frequency, and midline.★"
  - id: f-tf-6
    label: "F-TF.6 (+) — Understand that restricting a trigonometric function to a domain on which it is always…"
    group: f-tf-b
    maturityLevel: high-school
    description: "Common Core F-TF.6: (+) Understand that restricting a trigonometric function to a domain on which it is always increasing or always decreasing allows its inverse to be constructed."
  - id: f-tf-7
    label: "F-TF.7 (+) — Use inverse functions to solve trigonometric equations that arise in modeling contexts"
    group: f-tf-b
    maturityLevel: high-school
    description: "Common Core F-TF.7: (+) Use inverse functions to solve trigonometric equations that arise in modeling contexts; evaluate the solutions using technology, and interpret them in terms of the context.★"
  - id: f-tf-8
    label: "F-TF.8 — Prove the Pythagorean identity sin²(θ) + cos²(θ) = 1 and use it to find sin(θ)"
    group: f-tf-c
    maturityLevel: high-school
    description: "Common Core F-TF.8: Prove the Pythagorean identity sin²(θ) + cos²(θ) = 1 and use it to find sin(θ), cos(θ), or tan(θ) given sin(θ), cos(θ), or tan(θ) and the quadrant of the angle."
  - id: f-tf-9
    label: "F-TF.9 (+) — Prove the addition and subtraction formulas for sine"
    group: f-tf-c
    maturityLevel: high-school
    description: "Common Core F-TF.9: (+) Prove the addition and subtraction formulas for sine, cosine, and tangent and use them to solve problems."
  - id: g-co-1
    label: "G-CO.1 — Know precise definitions of angle, circle, perpendicular line, parallel line, and line…"
    group: g-co-a
    maturityLevel: high-school
    description: "Common Core G-CO.1: Know precise definitions of angle, circle, perpendicular line, parallel line, and line segment, based on the undefined notions of point, line, distance along a line, and distance around a circular arc."
  - id: g-co-2
    label: "G-CO.2 — Represent transformations in the plane using"
    group: g-co-a
    maturityLevel: high-school
    description: "Common Core G-CO.2: Represent transformations in the plane using, e.g., transparencies and geometry software; describe transformations as functions that take points in the plane as inputs and give other points as outputs. Compare transformations that preserve distance and angle to those that do not (e.g., translation versus horizontal stretch)."
  - id: g-co-3
    label: "G-CO.3 — Given a rectangle, parallelogram, trapezoid, or regular polygon, describe the rotations…"
    group: g-co-a
    maturityLevel: high-school
    description: "Common Core G-CO.3: Given a rectangle, parallelogram, trapezoid, or regular polygon, describe the rotations and reflections that carry it onto itself."
  - id: g-co-4
    label: "G-CO.4 — Develop definitions of rotations, reflections, and translations in terms of angles,…"
    group: g-co-a
    maturityLevel: high-school
    description: "Common Core G-CO.4: Develop definitions of rotations, reflections, and translations in terms of angles, circles, perpendicular lines, parallel lines, and line segments."
  - id: g-co-5
    label: "G-CO.5 — Given a geometric figure and a rotation"
    group: g-co-a
    maturityLevel: high-school
    description: "Common Core G-CO.5: Given a geometric figure and a rotation, reflection, or translation, draw the transformed figure using, e.g., graph paper, tracing paper, or geometry software. Specify a sequence of transformations that will carry a given figure onto another."
  - id: g-co-6
    label: "G-CO.6 — Use geometric descriptions of rigid motions to transform figures and to predict the…"
    group: g-co-b
    maturityLevel: high-school
    description: "Common Core G-CO.6: Use geometric descriptions of rigid motions to transform figures and to predict the effect of a given rigid motion on a given figure; given two figures, use the definition of congruence in terms of rigid motions to decide if they are congruent."
  - id: g-co-7
    label: "G-CO.7 — Use the definition of congruence in terms of rigid motions to show that two triangles…"
    group: g-co-b
    maturityLevel: high-school
    description: "Common Core G-CO.7: Use the definition of congruence in terms of rigid motions to show that two triangles are congruent if and only if corresponding pairs of sides and corresponding pairs of angles are congruent."
  - id: g-co-8
    label: "G-CO.8 — Explain how the criteria for triangle congruence"
    group: g-co-b
    maturityLevel: high-school
    description: "Common Core G-CO.8: Explain how the criteria for triangle congruence (ASA, SAS, and SSS) follow from the definition of congruence in terms of rigid motions."
  - id: g-co-9
    label: "G-CO.9 — Prove theorems about lines and angles"
    group: g-co-c
    maturityLevel: high-school
    description: "Common Core G-CO.9: Prove theorems about lines and angles. Clarifications: Theorems include: vertical angles are congruent; when a transversal crosses parallel lines, alternate interior angles are congruent and corresponding angles are congruent; points on a perpendicular bisector of a line segment are exactly those equidistant from the segment's endpoints."
  - id: g-co-10
    label: "G-CO.10 — Prove theorems about triangles"
    group: g-co-c
    maturityLevel: high-school
    description: "Common Core G-CO.10: Prove theorems about triangles. Clarifications: Theorems include: measures of interior angles of a triangle sum to 180°; base angles of isosceles triangles are congruent; the segment joining midpoints of two sides of a triangle is parallel to the third side and half the length; the medians of a triangle meet at a point."
  - id: g-co-11
    label: "G-CO.11 — Prove theorems about parallelograms"
    group: g-co-c
    maturityLevel: high-school
    description: "Common Core G-CO.11: Prove theorems about parallelograms. Clarifications: Theorems include: opposite sides are congruent, opposite angles are congruent, the diagonals of a parallelogram bisect each other, and conversely, rectangles are parallelograms with congruent diagonals."
  - id: g-co-12
    label: "G-CO.12 — Make formal geometric constructions with a variety of tools and methods"
    group: g-co-d
    maturityLevel: high-school
    description: "Common Core G-CO.12: Make formal geometric constructions with a variety of tools and methods (compass and straightedge, string, reflective devices, paper folding, dynamic geometric software, etc.). Copying a segment; copying an angle; bisecting a segment; bisecting an angle; constructing perpendicular lines, including the perpendicular bisector of a line segment; and constructing a line parallel to a given line through a point not on the line."
  - id: g-co-13
    label: "G-CO.13 — Construct an equilateral triangle, a square, and a regular hexagon inscribed in a circle"
    group: g-co-d
    maturityLevel: high-school
    description: "Common Core G-CO.13: Construct an equilateral triangle, a square, and a regular hexagon inscribed in a circle."
  - id: g-srt-1
    label: "G-SRT.1 — Verify experimentally the properties of dilations given by a center and a scale factor"
    group: g-srt-a
    maturityLevel: high-school
    description: "Common Core G-SRT.1: Verify experimentally the properties of dilations given by a center and a scale factor: Substandards: undefined. A dilation takes a line not passing through the center of the dilation to a parallel line, and leaves a line passing through the center unchanged. undefined. The dilation of a line segment is longer or shorter in the ratio given by the scale factor."
  - id: g-srt-2
    label: "G-SRT.2 — Given two figures, use the definition of similarity in terms of similarity…"
    group: g-srt-a
    maturityLevel: high-school
    description: "Common Core G-SRT.2: Given two figures, use the definition of similarity in terms of similarity transformations to decide if they are similar; explain using similarity transformations the meaning of similarity for triangles as the equality of all corresponding pairs of angles and the proportionality of all corresponding pairs of sides."
  - id: g-srt-3
    label: "G-SRT.3 — Use the properties of similarity transformations to establish the AA criterion for two…"
    group: g-srt-a
    maturityLevel: high-school
    description: "Common Core G-SRT.3: Use the properties of similarity transformations to establish the AA criterion for two triangles to be similar."
  - id: g-srt-4
    label: "G-SRT.4 — Prove theorems about triangles"
    group: g-srt-b
    maturityLevel: high-school
    description: "Common Core G-SRT.4: Prove theorems about triangles. Clarifications: Theorems include: a line parallel to one side of a triangle divides the other two proportionally, and conversely; the Pythagorean Theorem proved using triangle similarity."
  - id: g-srt-5
    label: "G-SRT.5 — Use congruence and similarity criteria for triangles to solve problems and to prove…"
    group: g-srt-b
    maturityLevel: high-school
    description: "Common Core G-SRT.5: Use congruence and similarity criteria for triangles to solve problems and to prove relationships in geometric figures."
  - id: g-srt-6
    label: "G-SRT.6 — Understand that by similarity, side ratios in right triangles are properties of the…"
    group: g-srt-c
    maturityLevel: high-school
    description: "Common Core G-SRT.6: Understand that by similarity, side ratios in right triangles are properties of the angles in the triangle, leading to definitions of trigonometric ratios for acute angles."
  - id: g-srt-7
    label: "G-SRT.7 — Explain and use the relationship between the sine and cosine of complementary angles"
    group: g-srt-c
    maturityLevel: high-school
    description: "Common Core G-SRT.7: Explain and use the relationship between the sine and cosine of complementary angles."
  - id: g-srt-8
    label: "G-SRT.8 — Use trigonometric ratios and the Pythagorean Theorem to solve right triangles in applied…"
    group: g-srt-c
    maturityLevel: high-school
    description: "Common Core G-SRT.8: Use trigonometric ratios and the Pythagorean Theorem to solve right triangles in applied problems.★"
  - id: g-srt-9
    label: "G-SRT.9 (+) — Derive the formula A = 1/2 ab sin(C) for the area of a triangle by drawing an auxiliary…"
    group: g-srt-d
    maturityLevel: high-school
    description: "Common Core G-SRT.9: (+) Derive the formula A = 1/2 ab sin(C) for the area of a triangle by drawing an auxiliary line from a vertex perpendicular to the opposite side."
  - id: g-srt-10
    label: "G-SRT.10 (+) — Prove the Laws of Sines and Cosines and use them to solve problems"
    group: g-srt-d
    maturityLevel: high-school
    description: "Common Core G-SRT.10: (+) Prove the Laws of Sines and Cosines and use them to solve problems."
  - id: g-srt-11
    label: "G-SRT.11 (+) — Understand and apply the Law of Sines and the Law of Cosines to find unknown…"
    group: g-srt-d
    maturityLevel: high-school
    description: "Common Core G-SRT.11: (+) Understand and apply the Law of Sines and the Law of Cosines to find unknown measurements in right and non-right triangles (e.g., surveying problems, resultant forces)."
  - id: g-c-1
    label: "G-C.1 — Prove that all circles are similar"
    group: g-c-a
    maturityLevel: high-school
    description: "Common Core G-C.1: Prove that all circles are similar."
  - id: g-c-2
    label: "G-C.2 — Identify and describe relationships among inscribed angles, radii, and chords"
    group: g-c-a
    maturityLevel: high-school
    description: "Common Core G-C.2: Identify and describe relationships among inscribed angles, radii, and chords. Clarifications: Include the relationship between central, inscribed, and circumscribed angles; inscribed angles on a diameter are right angles; the radius of a circle is perpendicular to the tangent where the radius intersects the circle."
  - id: g-c-3
    label: "G-C.3 — Construct the inscribed and circumscribed circles of a triangle"
    group: g-c-a
    maturityLevel: high-school
