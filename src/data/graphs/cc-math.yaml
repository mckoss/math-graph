  - id: g-gpe-4
    label: "G-GPE.4 — Use coordinates to prove simple geometric theorems algebraically"
    group: g-gpe-b
    maturityLevel: high-school
    description: "Common Core G-GPE.4: Use coordinates to prove simple geometric theorems algebraically. Clarifications: For example, prove or disprove that a figure defined by four given points in the coordinate plane is a rectangle; prove or disprove that the point (1, √3) lies on the circle centered at the origin and containing the point (0, 2)."
  - id: g-gpe-5
    label: "G-GPE.5 — Prove the slope criteria for parallel and perpendicular lines and use them to solve…"
    group: g-gpe-b
    maturityLevel: high-school
    description: "Common Core G-GPE.5: Prove the slope criteria for parallel and perpendicular lines and use them to solve geometric problems (e.g., find the equation of a line parallel or perpendicular to a given line that passes through a given point)."
  - id: g-gpe-6
    label: "G-GPE.6 — Find the point on a directed line segment between two given points that partitions the…"
    group: g-gpe-b
    maturityLevel: high-school
    description: "Common Core G-GPE.6: Find the point on a directed line segment between two given points that partitions the segment in a given ratio."
  - id: g-gpe-7
    label: "G-GPE.7 — Use coordinates to compute perimeters of polygons and areas of triangles and rectangles"
    group: g-gpe-b
    maturityLevel: high-school
    description: "Common Core G-GPE.7: Use coordinates to compute perimeters of polygons and areas of triangles and rectangles, e.g., using the distance formula.★"
  - id: g-gmd-1
    label: "G-GMD.1 — Give an informal argument for the formulas for the circumference of a circle"
    group: g-gmd-a
    maturityLevel: high-school
    description: "Common Core G-GMD.1: Give an informal argument for the formulas for the circumference of a circle, area of a circle, volume of a cylinder, pyramid, and cone. Clarifications: Use dissection arguments, Cavalieri's principle, and informal limit arguments."
  - id: g-gmd-2
    label: "G-GMD.2 (+) — Give an informal argument using Cavalieri's principle for the formulas for the volume of…"
    group: g-gmd-a
    maturityLevel: high-school
    description: "Common Core G-GMD.2: (+) Give an informal argument using Cavalieri's principle for the formulas for the volume of a sphere and other solid figures."
  - id: g-gmd-3
    label: "G-GMD.3 — Use volume formulas for cylinders, pyramids, cones, and spheres to solve problems"
    group: g-gmd-a
    maturityLevel: high-school
    description: "Common Core G-GMD.3: Use volume formulas for cylinders, pyramids, cones, and spheres to solve problems.★"
  - id: g-gmd-4
    label: "G-GMD.4 — Identify the shapes of two-dimensional cross-sections of three-dimensional objects"
    group: g-gmd-b
    maturityLevel: high-school
